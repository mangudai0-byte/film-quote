<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오션메이드 필름 견적서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 에르메스 × 오션메이드 컬러 */
  --om-orange:   #E8630A;   /* 오션메이드 브랜드 오렌지 */
  --om-brown:    #3D1F0A;   /* 다크 브라운 */
  --om-brown-mid:#6B3A1F;   /* 미디엄 브라운 */
  --om-cream:    #FAF5EE;   /* 에르메스 크림 */
  --om-cream-dk: #F0E6D6;   /* 진한 크림 */
  --om-gold:     #C8941A;   /* 골드 액센트 */

  /* 기능 컬러 (기존 변수명 유지) */
  --pk-red:    #E8630A;
  --pk-yellow: #C8941A;
  --pk-blue:   #3D1F0A;
  --blue:      #3D1F0A;
  --blue-light:#FAF5EE;
  --blue-mid:  #6B3A1F;
  --orange:    #E8630A;
  --orange-light:#FEF0E4;
  --green:     #4A6741;
  --green-light:#EAF0E8;
  --yellow:    #C8941A;

  --gray-900: #1A0F05;
  --gray-700: #3D1F0A;
  --gray-500: #8C6545;
  --gray-100: #F5EDE0;
  --gray-50:  #FAF7F2;
  --white:    #FFFFFF;
  --border:   #DDD0BC;
  --radius:   10px;
  --shadow-sm:0 2px 8px rgba(61,31,10,.10);
  --shadow:   0 4px 18px rgba(61,31,10,.15);

  --font-serif: 'Playfair Display', 'Noto Serif KR', Georgia, serif;
  --font-sans:  'Noto Sans KR', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--font-sans);
  background: var(--om-cream);
  color:var(--gray-900); min-height:100vh;
}

/* ── 헤더 ── */
header{
  background: var(--om-brown);
  color: var(--om-cream);
  padding:0 18px; height:58px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
  box-shadow:0 2px 12px rgba(61,31,10,.4);
  border-bottom:2px solid var(--om-orange);
}
header h1{
  font-family:var(--font-serif);
  font-size:16px; font-weight:700; letter-spacing:.5px;
  color:var(--om-cream);
}

/* ── 레이아웃 ── */
.container{max-width:540px;margin:0 auto;padding:16px 14px 100px;}

/* ── 카드 ── */
.card{
  background:var(--white);
  border-radius:var(--radius);
  margin-bottom:14px;
  border:1.5px solid var(--border);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.card-header{
  background: linear-gradient(to right, var(--om-cream-dk), #F5E8D5);
  border-bottom:1.5px solid var(--border);
  padding:11px 18px;
  display:flex; align-items:center; gap:10px;
}
.card-header .icon{
  width:28px;height:28px;
  background: var(--om-orange);
  border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  box-shadow:0 2px 6px rgba(232,99,10,.3);
}
.card-header h2{
  font-family:var(--font-serif);
  font-size:13px;font-weight:700;color:var(--om-brown);
  letter-spacing:.3px;
}
.card-body{padding:16px 18px;}

/* ── 폼 ── */
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{
  font-size:10px;color:var(--gray-500);font-weight:700;
  display:block;margin-bottom:5px;
  letter-spacing:.8px;text-transform:uppercase;
  font-family:var(--font-serif);
}
.field input,.field select{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;font-family:inherit;
  background:var(--white);color:var(--gray-900);
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{
  outline:none;border-color:var(--om-orange);
  box-shadow:0 0 0 3px rgba(232,99,10,.12);
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── 아이템 카드 ── */
.item-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-sm);}
.item-row{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.item-num{
  width:24px;height:24px;flex-shrink:0;
  background:var(--om-orange);color:white;
  border-radius:50%;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(232,99,10,.3);
}
.item-row-info{flex:1;min-width:0;}
.item-row-name{
  font-size:13px;font-weight:700;color:var(--gray-900);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--font-serif);
}
.item-row-sub{font-size:11px;color:var(--gray-500);margin-top:2px;}
.item-row-amt{font-size:14px;font-weight:800;color:var(--om-brown);white-space:nowrap;flex-shrink:0;}
.item-expand-btn{width:24px;height:24px;flex-shrink:0;background:var(--om-cream);border:1.5px solid var(--border);border-radius:5px;font-size:10px;color:var(--gray-500);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.del-btn{width:28px;height:28px;flex-shrink:0;background:none;border:1.5px solid #E8C0A0;border-radius:6px;font-size:15px;color:var(--om-orange);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.item-detail{border-top:1.5px solid var(--border);background:var(--om-cream);}
.item-detail.hidden{display:none;}
.item-body{padding:14px;display:flex;flex-direction:column;gap:11px;}

/* ── 셀렉트 ── */
.sel-group{display:flex;flex-direction:column;gap:8px;}
.sel-block{position:relative;}
.sel-block label{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:block;margin-bottom:5px;font-family:var(--font-serif);}
.sel-block.cat label{color:var(--om-brown);}
.sel-block.model label{color:var(--om-brown-mid);}
.sel-block::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;margin-top:8px;}
.sel-block.cat::after{color:var(--om-brown);}
.sel-block.model::after{color:var(--om-brown-mid);}
.sel-block select{width:100%;padding:11px 36px 11px 14px;border-radius:8px;font-size:14px;font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;font-weight:600;}
.sel-block.cat select{border:1.5px solid #C8A070;background:linear-gradient(to bottom,#FAF0E4,#F5E6D2);color:var(--om-brown);}
.sel-block.model select{border:1.5px solid #D4B090;background:linear-gradient(to bottom,#FBF5EC,#F5EDE0);color:var(--om-brown-mid);}

/* ── 수량 ── */
.qty-box{background:var(--om-cream);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;}
.qty-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.qty-label{font-size:12px;font-weight:700;color:var(--om-brown);font-family:var(--font-serif);}
.qty-stepper{display:flex;align-items:center;margin-left:auto;border-radius:9px;overflow:hidden;border:1.5px solid var(--border);}
.qty-btn{width:40px;height:40px;border:none;background:white;font-size:20px;color:var(--om-brown);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qty-btn:active{background:var(--om-cream-dk);}
.qty-input{width:58px;height:40px;border:none;border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);text-align:center;font-size:16px;font-weight:700;font-family:inherit;color:var(--gray-900);background:white;}
.qty-unit{font-size:13px;color:var(--gray-500);margin-left:6px;font-weight:500;}
.qty-shorts{display:flex;gap:6px;flex-wrap:wrap;}
.qty-short{padding:6px 11px;font-size:12px;font-family:inherit;font-weight:700;border:1.5px solid var(--border);border-radius:7px;background:white;color:var(--om-brown);cursor:pointer;}
.qty-short:active{background:var(--om-orange);color:white;border-color:var(--om-orange);}

/* ── 계산 내역 ── */
.breakdown{background:white;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;}
.bd-title{font-size:10px;font-weight:700;color:var(--gray-500);margin-bottom:8px;letter-spacing:.8px;text-transform:uppercase;font-family:var(--font-serif);}
.bd-chips{display:flex;flex-direction:column;gap:7px;}
.bd-chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;}
.bd-chip.roll-chip{background:linear-gradient(to right,#FAF0E4,#FBF5EC);}
.bd-chip.cut-chip{background:linear-gradient(to right,#FEF0E4,#FFF5EE);}
.bd-chip .chip-left{display:flex;align-items:center;gap:7px;}
.bd-chip .chip-tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;}
.roll-chip .chip-tag{background:var(--om-brown);color:var(--om-cream);}
.cut-chip .chip-tag{background:var(--om-orange);color:white;}
.bd-chip .chip-desc{font-size:12px;color:var(--gray-700);}
.bd-chip .chip-amt{font-size:14px;font-weight:700;}
.roll-chip .chip-amt{color:var(--om-brown);}
.cut-chip .chip-amt{color:var(--om-orange);}
.bd-total{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--border);display:flex;justify-content:space-between;align-items:baseline;}
.bd-total .lbl{font-size:12px;color:var(--gray-500);font-weight:600;font-family:var(--font-serif);}
.bd-total .val{font-size:22px;font-weight:800;color:var(--gray-900);font-family:var(--font-serif);}

/* ── 확정 버튼 ── */
.confirm-item-btn{width:100%;padding:13px;background:var(--om-brown);color:var(--om-cream);border:none;border-radius:9px;font-size:15px;font-weight:700;font-family:var(--font-serif);cursor:pointer;letter-spacing:.5px;}

/* ── 추가 버튼 ── */
.add-btn{width:100%;padding:14px;border:1.5px dashed #C8A070;border-radius:var(--radius);background:rgba(250,245,238,.6);font-size:14px;font-family:var(--font-serif);color:var(--om-brown);cursor:pointer;font-weight:700;letter-spacing:.3px;}
.add-btn:active{background:var(--om-cream-dk);}

/* ── 합계 바 ── */
.total-bar{
  background: var(--om-orange);
  border-radius:var(--radius);padding:18px 22px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
  box-shadow:0 4px 18px rgba(232,99,10,.35);
  border:1.5px solid var(--om-brown);
}
.total-bar .lbl{font-size:13px;opacity:.9;font-weight:600;color:var(--om-cream);font-family:var(--font-serif);letter-spacing:.5px;}
.total-bar .amt{font-size:28px;font-weight:900;color:var(--om-cream);font-family:var(--font-serif);letter-spacing:-1px;}

/* ── 버튼 ── */
.actions{display:flex;gap:10px;}
.btn-reset{padding:14px 20px;border:1.5px solid var(--border);border-radius:var(--radius);background:white;font-size:14px;font-family:inherit;color:var(--gray-700);cursor:pointer;font-weight:700;}
.btn-preview{flex:1;padding:15px;background:var(--om-brown);color:var(--om-cream);border:none;border-radius:var(--radius);font-size:15px;font-weight:800;font-family:var(--font-serif);cursor:pointer;letter-spacing:.5px;box-shadow:0 4px 14px rgba(61,31,10,.3);}
.btn-print{flex:1;padding:14px;background:var(--om-brown);color:var(--om-cream);border:none;border-radius:var(--radius);font-size:14px;font-weight:700;font-family:var(--font-serif);cursor:pointer;}
.btn-confirm{flex:1;padding:14px;background:var(--green);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}

/* ── 비밀번호 화면 ── */
.pw-screen{
  position:fixed;inset:0;z-index:200;
  background: var(--om-brown);
  display:flex;align-items:center;justify-content:center;
}
.pw-screen.hidden{display:none;}
.pw-box{
  background:var(--om-cream);border-radius:20px;
  padding:40px 32px;width:320px;text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
  border:2px solid var(--om-orange);
}
.pw-title{
  font-size:22px;font-weight:900;color:var(--om-brown);
  margin-bottom:4px;font-family:var(--font-serif);letter-spacing:.5px;
}
.pw-sub{font-size:13px;color:var(--gray-500);margin-bottom:24px;font-family:var(--font-serif);}
.pw-input{
  width:100%;padding:13px;border:1.5px solid var(--border);border-radius:10px;
  font-size:18px;text-align:center;font-family:inherit;margin-bottom:12px;
  letter-spacing:6px;background:white;
}
.pw-input:focus{outline:none;border-color:var(--om-orange);box-shadow:0 0 0 3px rgba(232,99,10,.15);}
.pw-btn{
  width:100%;padding:14px;
  background:var(--om-orange);color:white;
  border:none;border-radius:10px;font-size:16px;font-weight:800;
  font-family:var(--font-serif);cursor:pointer;letter-spacing:.5px;
  box-shadow:0 4px 14px rgba(232,99,10,.4);
}
.pw-error{color:var(--om-orange);font-size:13px;font-weight:600;margin-top:10px;opacity:0;transition:opacity .2s;font-family:var(--font-serif);}
.pw-error.show{opacity:1;}

/* ── 모달 ── */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(61,31,10,.7);overflow-y:auto;display:none;}
.ovl.show{display:block;}
.modal{background:var(--om-cream);max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.modal-bar{
  background:var(--om-brown);
  padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
  border-bottom:2px solid var(--om-orange);
}
.modal-bar h3{font-size:15px;font-weight:800;color:var(--om-cream);font-family:var(--font-serif);letter-spacing:.5px;}
.close-btn{height:36px;padding:0 12px;background:rgba(250,245,238,.15);border:1.5px solid rgba(250,245,238,.4);border-radius:7px;font-size:14px;color:var(--om-cream);font-weight:700;display:flex;align-items:center;cursor:pointer;white-space:nowrap;}
.parea{flex:1;overflow-y:auto;padding:16px;}

/* ── 견적서 ── */
.pv-wrap{padding:6px 0 24px;}
.pv-title{text-align:center;font-size:22px;font-weight:900;letter-spacing:8px;color:var(--om-brown);margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--om-orange);font-family:var(--font-serif);}
.pv-info{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;background:white;}
.pv-row{display:flex;align-items:baseline;padding:9px 14px;border-bottom:1px solid #EEE8E0;font-size:13px;}
.pv-row:last-child{border-bottom:none;}
.pv-k{color:var(--gray-500);font-size:10px;min-width:60px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-family:var(--font-serif);}
.pv-v{color:#111;font-weight:500;flex:1;}
.pv-v.bold{font-size:16px;font-weight:900;font-family:var(--font-serif);color:var(--om-brown);}
.pv-table-wrap{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.pv-table{width:100%;border-collapse:collapse;font-size:13px;}
.pv-table thead tr{background:var(--om-brown);}
.pv-table th{padding:9px 6px;color:var(--om-cream);font-size:11px;font-weight:700;letter-spacing:.4px;font-family:var(--font-serif);}
.pv-table th:first-child{text-align:left;padding-left:12px;}
.pv-table th:nth-child(n+2){text-align:right;padding-right:8px;}
.pv-table td{padding:10px 6px;border-bottom:1px solid #F0E8DC;color:#111;}
.pv-table td:first-child{text-align:left;padding-left:12px;font-weight:700;}
.pv-table td:nth-child(n+2){text-align:right;padding-right:8px;}
.pv-table tbody tr:nth-child(even){background:var(--om-cream);}
.sub-row td{font-size:12px!important;font-weight:400!important;color:#AAA!important;background:var(--om-cream)!important;}
.pv-table tfoot td{padding:12px 6px;background:var(--om-cream-dk);border-top:2px solid var(--om-orange);font-weight:900;color:var(--om-brown);font-size:15px;font-family:var(--font-serif);}
.pv-table tfoot td:first-child{padding-left:12px;}
.pv-table tfoot td:last-child{text-align:right;padding-right:8px;font-size:18px;}
.pv-bank{border:2px solid var(--om-orange);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.pv-bank-notice{background:var(--om-orange);color:white;text-align:center;padding:9px;font-size:13px;font-weight:800;letter-spacing:4px;font-family:var(--font-serif);}
.pv-bank-body{padding:12px 16px;background:white;}
.pv-bank-num{font-size:22px;font-weight:900;color:var(--om-brown);letter-spacing:1px;margin-bottom:4px;font-family:var(--font-serif);}
.pv-bank-info{font-size:12px;color:#666;}
.pv-supplier{text-align:center;padding:8px;background:var(--om-cream);border-radius:8px;font-size:12px;color:var(--gray-500);font-weight:600;}
.pv-supplier-body{border:1.5px solid var(--border);border-radius:8px;overflow:hidden;}
.pv-supplier-body.hidden{display:none;}

/* ── 인쇄 ── */
@media print{.modal{min-height:unset;}.parea{padding:10px;}}
</style>
</head>

// ===== 필름 견적 로직 =====
let items = [];
let cnt = 0;

function today(){ return new Date().toISOString().slice(0,10); }
document.getElementById('rdate').value = today();

function calc(qty, r, c){
  if(qty<=0) return {amt:0,rollM:0,cutM:0};
  const rollM = Math.floor(qty/ROLL_M)*ROLL_M;
  const cutM  = qty % ROLL_M;
  return { amt: rollM*r + cutM*c, rollM, cutM };
}

function addItem(){
  const id=cnt++;
  const firstKey=MODEL_KEYS[0];
  const db=MODEL_DB[firstKey];
  items.push({id, catKey:firstKey, modelName:db.models[0], qty:5, r:db.roll, c:db.cut, open:true});
  renderAll();
}

function removeItem(id){ items=items.filter(x=>x.id!==id); renderAll(); }
function get(id){ return items.find(x=>x.id===id); }

function onCat(id, catKey){
  const it=get(id);
  it.catKey=catKey;
  const db=MODEL_DB[catKey];
  it.modelName=db.models[0];
  it.r=db.roll;
  it.c=db.cut;
  // 카드 닫지 않고 소분류 셀렉트만 업데이트
  const det=document.getElementById('det-'+id);
  if(det && !det.classList.contains('hidden')){
    // 소분류 셀렉트 내용 교체
    const modelSel=det.querySelector('.model-sel');
    if(modelSel){
      modelSel.innerHTML=db.models.map(m=>`<option value="${m}"${m===it.modelName?' selected':''}>${m}</option>`).join('');
      // 소분류로 자동 포커스
      setTimeout(()=>modelSel.focus(), 30);
    }
    // 단가 박스 업데이트
    const rollVal=det.querySelector('.roll-val');
    const cutVal=det.querySelector('.cut-val');
    if(rollVal) rollVal.textContent=it.r.toLocaleString();
    if(cutVal) cutVal.textContent=it.c.toLocaleString();
  }
  // 헤더(이름, 금액)만 업데이트
  updateItemHeader(id);
}

function onModel(id, modelName){
  const it=get(id);
  it.modelName=modelName;
  updateItemHeader(id);
  updateBreakdown(id);
  // 수량 입력으로 자동 포커스
  const det=document.getElementById('det-'+id);
  if(det && !det.classList.contains('hidden')){
    setTimeout(()=>{
      const qtyInput=det.querySelector('.qty-input');
      if(qtyInput){ qtyInput.focus(); qtyInput.select(); }
    }, 30);
  }
}

function onQty(id,v){ const it=get(id); it.qty=+v||0; updateItemHeader(id); updateBreakdown(id); }
function stepQty(id,d){ const it=get(id); it.qty=Math.max(0,it.qty+d); const inp=document.querySelector(`#det-${id} .qty-input`); if(inp) inp.value=it.qty; updateItemHeader(id); updateBreakdown(id); }
function setQty(id,v){ const it=get(id); it.qty=v; const inp=document.querySelector(`#det-${id} .qty-input`); if(inp) inp.value=v; updateItemHeader(id); updateBreakdown(id); }

function updateItemHeader(id){
  const it=get(id); if(!it) return;
  const db=MODEL_DB[it.catKey]; if(!db) return;
  const {amt}=calc(it.qty,it.r,it.c);
  const nameEl=document.querySelector(`#det-${id}`)?.closest('.item-card')?.querySelector('.item-row-name');
  const subEl=document.querySelector(`#det-${id}`)?.closest('.item-card')?.querySelector('.item-row-sub');
  const amtEl=document.querySelector(`#det-${id}`)?.closest('.item-card')?.querySelector('.item-row-amt');
  if(nameEl) nameEl.textContent=db.name;
  if(subEl) subEl.textContent=`${it.modelName} · ${it.qty}m`;
  if(amtEl){ amtEl.textContent=amt.toLocaleString()+'원'; amtEl.className='item-row-amt'+(amt===0?' zero':''); }
  // 합계 업데이트
  let total=0; items.forEach(x=>{const{amt}=calc(x.qty,x.r,x.c); total+=amt;});
  document.getElementById('total-amt').textContent=total.toLocaleString()+' 원';
}

function updateBreakdown(id){
  const it=get(id); if(!it) return;
  const {rollM,cutM,amt}=calc(it.qty,it.r,it.c);
  const det=document.getElementById('det-'+id); if(!det) return;
  const chipsEl=det.querySelector('.bd-chips');
  const totalEl=det.querySelector('.bd-total .val');
  if(chipsEl){
    let html='';
    if(rollM>0) html+=`<div class="bd-chip roll-chip"><div class="chip-left"><span class="chip-tag">롤</span><span class="chip-desc">${rollM}m × ${it.r.toLocaleString()}원</span></div><span class="chip-amt">${(rollM*it.r).toLocaleString()}원</span></div>`;
    if(cutM>0) html+=`<div class="bd-chip cut-chip"><div class="chip-left"><span class="chip-tag">절단</span><span class="chip-desc">${cutM}m × ${it.c.toLocaleString()}원</span></div><span class="chip-amt">${(cutM*it.c).toLocaleString()}원</span></div>`;
    chipsEl.innerHTML=html;
  }
  if(totalEl) totalEl.textContent=amt.toLocaleString()+'원';
}

function renderAll(){
  const wrap=document.getElementById('items-wrap');
  wrap.innerHTML=''; let total=0;
  items.forEach((it,idx)=>{ const{amt}=calc(it.qty,it.r,it.c); total+=amt; wrap.appendChild(buildEl(it,idx+1)); });
  document.getElementById('total-amt').textContent=total.toLocaleString()+' 원';
}

function toggleDetail(id){
  const it=get(id);
  const det=document.getElementById('det-'+id);
  const exp=document.getElementById('exp-'+id);
  const hidden=det.classList.contains('hidden');
  det.classList.toggle('hidden');
  exp.textContent=hidden?'▲':'▼';
  if(it) it.open=hidden; // 열림 상태 저장
}
function collapseItem(id){
  const it=get(id);
  document.getElementById('det-'+id).classList.add('hidden');
  document.getElementById('exp-'+id).textContent='▼';
  if(it) it.open=false;
}

// ===== 거래처 =====
let currentClientTab = 'film';
function loadClients(type='film'){ try{ return JSON.parse(localStorage.getItem(`om_clients_${type}`)||'[]'); }catch(e){ return []; } }
function saveClient(type='film'){
  const val=document.getElementById('new-client').value.trim();
  if(!val) return;
  const clients=loadClients(type);
  if(!clients.includes(val)){ clients.unshift(val); localStorage.setItem(`om_clients_${type}`,JSON.stringify(clients)); }
  document.getElementById('new-client').value='';
  refreshClientUI();
}
function deleteClient(name,type='film'){
  const clients=loadClients(type).filter(c=>c!==name);
  localStorage.setItem(`om_clients_${type}`,JSON.stringify(clients));
  refreshClientUI();
}
function moveClient(name,type,dir){
  const clients=loadClients(type);
  const idx=clients.indexOf(name);
  if(idx<0) return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=clients.length) return;
  clients.splice(idx,1); clients.splice(newIdx,0,name);
  localStorage.setItem(`om_clients_${type}`,JSON.stringify(clients));
  refreshClientUI();
}
function switchClientTab(type){
  currentClientTab=type;
  const fb=document.getElementById('tab-film');
  const db=document.getElementById('tab-door');
  if(fb){ fb.style.borderBottomColor=type==='film'?'var(--pk-red)':'transparent'; fb.style.color=type==='film'?'var(--pk-red)':'var(--gray-500)'; fb.style.fontWeight=type==='film'?'700':'600'; }
  if(db){ db.style.borderBottomColor=type==='door'?'var(--pk-red)':'transparent'; db.style.color=type==='door'?'var(--pk-red)':'var(--gray-500)'; db.style.fontWeight=type==='door'?'700':'600'; }
  refreshClientUI();
}
function toggleClientDrop(type){
  const drop = document.getElementById(type==='film'?'client-drop':'door-client-drop');
  if(!drop) return;
  const isOpen = drop.style.display !== 'none';
  // 모든 드롭 닫기
  ['client-drop','door-client-drop'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display='none';
  });
  if(!isOpen) drop.style.display='block';
}

function selectClient(type, name){

function loadSales(){ try{ return JSON.parse(localStorage.getItem('om_sales')||'[]'); }catch(e){ return []; } }
function saveSales(data){ localStorage.setItem('om_sales', JSON.stringify(data)); }

function confirmQuote(){
  const client = document.getElementById('client').value || '(거래처명)';
  const rd = document.getElementById('rdate').value;
  if(items.length === 0){ alert('품목을 추가해주세요.'); return; }

  const sales = loadSales();
  const month = rd.slice(0, 7); // YYYY-MM
  items.forEach(it => {
    const {amt, rollM, cutM} = calc(it.qty, it.r, it.c);
    sales.push({
      date: rd, month, client,
      product: it.modelName,
      group: it.catKey,
      qty: it.qty, amt, rollM, cutM
    });
  });
  saveSales(sales);

  // 확정 표시
  const btn = document.querySelector('.btn-confirm');
  btn.textContent = '✅ 저장완료!';
  btn.style.background = '#888';
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = '✅ 견적 확정';
    btn.style.background = '#1A7A4A';
    btn.disabled = false;
  }, 2000);
}

function showStats(){
  const sales = loadSales();
  const area = document.getElementById('stats-area');

  if(sales.length === 0){
    area.innerHTML = '<div class="stats-empty">📭 아직 확정된 견적이 없어요<br><br>견적서 보기 → 견적 확정 버튼을 누르면<br>데이터가 쌓여요!</div>';
    document.getElementById('stats-ovl').classList.add('show');
    return;
  }

  // 집계
  const totalAmt = sales.reduce((s,x)=>s+x.amt,0);
  const totalQty = sales.reduce((s,x)=>s+x.qty,0);

  // 제품별
  const byProduct = {};
  sales.forEach(x=>{
    if(!byProduct[x.product]) byProduct[x.product]={qty:0,amt:0};
    byProduct[x.product].qty += x.qty;
    byProduct[x.product].amt += x.amt;
  });
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].amt-a[1].amt).slice(0,10);
  const maxAmt = topProducts[0]?.[1]?.amt || 1;

  // 거래처별
  const byClient = {};
  sales.forEach(x=>{
    if(!byClient[x.client]) byClient[x.client]={qty:0,amt:0,cnt:0};
    byClient[x.client].qty += x.qty;
    byClient[x.client].amt += x.amt;
    byClient[x.client].cnt++;
  });
  const topClients = Object.entries(byClient).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8);

  // 월별
  const byMonth = {};
  sales.forEach(x=>{
    if(!byMonth[x.month]) byMonth[x.month]={amt:0,qty:0};
    byMonth[x.month].amt += x.amt;
    byMonth[x.month].qty += x.qty;
  });
  const months = Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const maxMonthAmt = Math.max(...months.map(m=>m[1].amt)) || 1;

  area.innerHTML = `
    <div class="stat-summary">
      <div class="summary-box"><div class="s-lbl">총 매출액</div><div class="s-val">${(totalAmt/10000).toFixed(0)}만원</div></div>
      <div class="summary-box green"><div class="s-lbl">총 판매량</div><div class="s-val">${totalQty}m</div></div>
    </div>

    <div class="stats-section">
      <h4>🏆 제품별 판매 순위</h4>
      ${topProducts.map(([name,d],i)=>`
        <div class="stat-card">
          <div class="stat-row">
            <span style="font-size:13px;font-weight:700;color:var(--gray-500);min-width:20px">${i+1}</span>
            <span class="stat-name">${name}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.round(d.amt/maxAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="stats-section">
      <h4>🏢 거래처별 매출</h4>
      <div class="stat-card">
        ${topClients.map(([name,d])=>`
          <div class="stat-client-row">
            <span style="font-weight:600">${name}</span>
            <span style="color:var(--gray-500);font-size:12px">${d.cnt}건 · ${d.qty}m</span>
            <span style="font-weight:700;color:var(--blue)">${d.amt.toLocaleString()}원</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="stats-section">
      <h4>📅 월별 매출</h4>
      ${months.map(([month,d])=>`
        <div class="stat-card">
          <div class="stat-row">
            <span class="stat-name">${month}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar orange" style="width:${Math.round(d.amt/maxMonthAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <button class="reset-stats-btn" onclick="resetStats()">🗑 데이터 전체 삭제</button>
  `;

  document.getElementById('stats-ovl').classList.add('show');
  document.getElementById('stats-ovl').scrollTop = 0;
}

function closeStats(){ document.getElementById('stats-ovl').classList.remove('show'); }

function resetStats(){
  if(!confirm('모든 판매 데이터를 삭제할까요?')) return;
  localStorage.removeItem('om_sales');
  closeStats();
}

function exportStats(){
  const sales = loadSales();
  if(sales.length === 0){ alert('데이터가 없어요.'); return; }
  const header = '날짜,월,거래처,제품명,그룹,수량(m),금액,롤(m),절단(m)';
  const rows = sales.map(x=>`${x.date},${x.month},${x.client},${x.product},${x.group},${x.qty},${x.amt},${x.rollM},${x.cutM}`);
  const csv = '\uFEFF' + [header, ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `오션메이드_판매데이터_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// 원판 사이즈 (SketchCut 기준 1220×2440)
const SHEET_W = 2440; // 세로(길이) — 절대 보존
const SHEET_H = 1220; // 가로(폭) — 컬럼 배치 방향
const KERF = 6;       // 칼날 두께 6mm

// 등급 계산: 원판 기준
function getDoorGrade(w, h) {
  const maxSide = Math.max(w, h);
  if (maxSide <= 2100) return 1;
  if (maxSide <= 2300) return 2;
  return 3;
}


// ===== 가로 절단 알고리즘 (By Length - 수평 절단) =====
// ===== MAXRECTS 재단 배치도 =====
// 소요량: 컬럼 방식(길로틴 원칙), 배치도: MAXRECTS(정확한 시각화)

function normalizePiece(w, h) {
  return { rowL: Math.max(w,h), rowH: Math.min(w,h) };
}

function buildColumns(pieces) {
  const sorted = [...pieces].sort((a,b) => b.rowL - a.rowL || b.rowH - a.rowH);
  const columns = [];
  for(const p of sorted) {
    let bestCol = null, bestWaste = Infinity;
    for(const col of columns) {
      if(p.rowH <= col.colW && col.usedY + p.rowL <= 2440) {
        const waste = col.colW - p.rowH;
        if(waste < bestWaste) { bestWaste = waste; bestCol = col; }
      }
    }
    if(bestCol) { bestCol.items.push(p); bestCol.usedY += p.rowL + KERF; }
    else columns.push({ colW: p.rowH, usedY: p.rowL + KERF, items: [p] });
  }
  return columns;
}

function maxRectsPack(pieces) {
  const sheets = [];

  function splitFree(free, px, py, pw, ph) {
    const result = [];
    for(const f of free) {
      const ox = px < f.x+f.w && px+pw > f.x && py < f.y+f.h && py+ph > f.y;
      if(!ox) { result.push(f); continue; }
      if(f.x < px)           result.push({x:f.x,      y:f.y, w:px-f.x,              h:f.h});
      if(f.x+f.w > px+pw+KERF) result.push({x:px+pw+KERF, y:f.y, w:f.x+f.w-(px+pw+KERF), h:f.h});
      if(f.y < py)           result.push({x:f.x, y:f.y,      w:f.w, h:py-f.y});
      if(f.y+f.h > py+ph+KERF) result.push({x:f.x, y:py+ph+KERF, w:f.w, h:f.y+f.h-(py+ph+KERF)});
    }
    return result.filter((a,i) => a.w>0 && a.h>0 && !result.some((b,j) =>
      i!==j && b.x<=a.x && b.y<=a.y && b.x+b.w>=a.x+a.w && b.y+b.h>=a.y+a.h
    ));
  }

  const pcs = [...pieces].sort((a,b) => b.rowL*b.rowH - a.rowL*a.rowH);

  for(const p of pcs) {
    let bestScore=Infinity, bestSh=null, bestF=null, bestW=p.rowH, bestH=p.rowL;
    for(const sh of sheets) {
      for(const f of sh.free) {
        if(p.rowH<=f.w && p.rowL<=f.h) {
          const sc=Math.min(f.w-p.rowH, f.h-p.rowL);
          if(sc<bestScore){bestScore=sc;bestSh=sh;bestF=f;bestW=p.rowH;bestH=p.rowL;}
        }
        if(p.rowL<=f.w && p.rowH<=f.h) {
          const sc=Math.min(f.w-p.rowL, f.h-p.rowH);
          if(sc<bestScore){bestScore=sc;bestSh=sh;bestF=f;bestW=p.rowL;bestH=p.rowH;}
        }
      }
    }
    if(bestSh && bestF) {
      bestSh.pieces.push({x:bestF.x,y:bestF.y,w:bestW,h:bestH,origW:p.origW,origH:p.origH,name:p.name});
      bestSh.free = splitFree(bestSh.free, bestF.x, bestF.y, bestW, bestH);
    } else {
      const sh = {pieces:[],free:[{x:0,y:0,w:1220,h:2440}]};
      sheets.push(sh);
      sh.pieces.push({x:0,y:0,w:p.rowH,h:p.rowL,origW:p.origW,origH:p.origH,name:p.name});
      sh.free = splitFree(sh.free, 0, 0, p.rowH, p.rowL);
    }
  }
  return sheets;
}

function optimizeCuts(doors) {
  const pieces = [];
  doors.forEach(d => {
    for(let i=0;i<d.qty;i++) {
      const {rowL,rowH} = normalizePiece(d.w,d.h);
      pieces.push({rowL,rowH,origW:d.w,origH:d.h,name:d.name});
    }
  });

  const sheets = maxRectsPack(pieces);

  // 효율 내림차순 정렬
  sheets.sort((a,b) => b.pieces.reduce((s,p)=>s+p.w*p.h,0) - a.pieces.reduce((s,p)=>s+p.w*p.h,0));

  // usedX 계산 (소요량용)
  sheets.forEach(sh => {
    sh.usedX = sh.pieces.length>0 ? Math.max(...sh.pieces.map(p=>p.x+p.w)) : 0;
  });

  return sheets;
}

function calcSheetDecimal(pieces) {
  if(!pieces || pieces.length === 0) return 0;

  const pcs = pieces.map(p => ({
    rowL: Math.max(p.w, p.h),
    rowH: Math.min(p.w, p.h)
  }));

  // buildColumns와 동일한 로직
  const sorted = [...pcs].sort((a,b) => b.rowL - a.rowL || b.rowH - a.rowH);
  const columns = [];
  for(const p of sorted) {
    let placed = false;
    for(const col of columns) {
      if(p.rowH <= col.colW && col.usedY + p.rowL <= 2440) {
        col.usedY += p.rowL + KERF;
        placed = true;
        break;
      }
    }
    if(!placed) columns.push({ colW: p.rowH, usedY: p.rowL + KERF });
  }

  // BFD로 원판에 컬럼 배치
  const colsSorted = [...columns].sort((a,b) => b.colW - a.colW);
  const sheets = [];
  for(const col of colsSorted) {
    let bestSh = null, bestWaste = Infinity;
    for(const sh of sheets) {
      const addX = sh.usedX > 0 ? KERF : 0;
      const remaining = 1220 - sh.usedX - addX - col.colW;
      if(remaining >= 0 && remaining < bestWaste) {
        bestWaste = remaining; bestSh = sh;
      }
    }
    if(bestSh) {
      bestSh.usedX = bestSh.usedX + (bestSh.usedX > 0 ? KERF : 0) + col.colW;
    } else {
      sheets.push({ usedX: col.colW });
    }
  }


  if(sheets.length === 0) return 0;
  // 원판을 usedX 내림차순 정렬 → 마지막 원판이 가장 작은 usedX
  sheets.sort((a,b) => b.usedX - a.usedX);
  const fullSheets = sheets.length - 1;
  const lastUsedX = sheets[sheets.length - 1].usedX;
  return fullSheets + Math.ceil(lastUsedX / 100) / 10;
}

let doorGroups = [];
let doorCnt = 0;
let doorGrade = 1;

function setDoorGrade(g){
  doorGrade = g;
  [1,2,3].forEach(n => {
    const btn = document.getElementById(`grade-btn-${n}`);
    if(!btn) return;
    if(n===g){ btn.style.background='var(--blue)'; btn.style.borderColor='var(--blue)'; btn.style.color='white'; }
    else { btn.style.background='white'; btn.style.borderColor='var(--border)'; btn.style.color='var(--gray-500)'; }
  });
  renderDoorGroups();
}

function getUnitPrice(key){
  const [name, type] = key.split('|');
  const price = DOOR_PRICES.find(p=>p.name===name && p.type===type)
             || DOOR_PRICES.find(p=>p.name===name);
  return price ? price[`g${doorGrade}`] : 0;
}

function addDoorGroup() {
  const key = DOOR_PRICES[0].name + '|' + DOOR_PRICES[0].type;
  doorGroups.push({ key, open: true, items: [{ id: doorCnt++, w: 900, h: 2100, qty: 1 }] });
  renderDoorGroups();
}

function removeDoorGroup(gi) {
  doorGroups.splice(gi, 1);
  renderDoorGroups();
  updateDoorTotals();
}

function toggleDoorGroup(gi) {
  doorGroups[gi].open = !doorGroups[gi].open;
  renderDoorGroups();
}

function updateDoorGroup(gi, field, val) {
  if(field === 'key') doorGroups[gi].key = val;
  renderDoorGroups();
  updateDoorTotals();
}

function addDoorRow(gi) {
  doorGroups[gi].items.push({ id: doorCnt++, w: 0, h: 0, qty: 1 });
  renderDoorGroups();
  setTimeout(() => {
    const rows = document.querySelectorAll(`.drow-w-${gi}`);
    if(rows.length) {
      const last = rows[rows.length - 1];
      last.focus();
      last.select();
    }
  }, 30);
}

function removeDoorRow(gi, id) {
  doorGroups[gi].items = doorGroups[gi].items.filter(x => x.id !== id);
  if(doorGroups[gi].items.length === 0) doorGroups.splice(gi, 1);
  renderDoorGroups();
  updateDoorTotals();
}

function updateDoorRow(gi, id, field, val) {
  const item = doorGroups[gi].items.find(x => x.id === id);
  if(item) item[field] = parseInt(val) || 0;
  updateDoorTotals();
}

  const flat = [];

}

          <button onclick="event.stopPropagation();removeDoorGroup(${gi})"
            style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:6px;color:white;cursor:pointer;font-size:12px;padding:3px 8px">삭제</button>
          <span style="color:white;font-size:14px">${g.open ? '▲' : '▼'}</span>
        </div>
      </div>
      ${rows}
    </div>`;
  }).join('');

  updateDoorTotals();
}

// 기존 doorItems 참조 함수들을 doorGroups 기반으로 교체
const _origUpdateDoorTotals = updateDoorTotals;
function updateDoorTotals() {
  const flat = getFlatDoorItems();
  const groups = {};
  flat.forEach(it => {
    if(!groups[it.key]) groups[it.key] = [];
    for(let i=0; i<it.qty; i++) groups[it.key].push({w:it.w, h:it.h});
  });
  let total = 0;
  Object.entries(groups).forEach(([key, pieces]) => {
    if(pieces.length === 0) return;
    const sd = calcSheetDecimal(pieces);
    const unit = getUnitPrice(key);
    total += Math.round(sd * unit);
  });
  const el = document.getElementById('door-total');
  if(el) el.textContent = total.toLocaleString() + ' 원';
}

}


// ===== 재단 시각화 (가로 절단) =====
let lastSheets = [];

function drawCutLayout(sheets) {
  const ovl = document.getElementById('cut-layout-ovl');
  const container = document.getElementById('cut-layout-container');
  if(!ovl || !container) return;

  const COLORS = ['#B8D4E8','#F5D5B0','#C8E6C8','#F5C5D0','#D8D0F0','#F0E8C0','#C8E0E8','#E8D0C8','#D0E8D0','#E8E0D0'];
  const keyColorMap = {};
  let colorIdx = 0;
  getFlatDoorItems().forEach(it => {
    if(!keyColorMap[it.key]) keyColorMap[it.key] = COLORS[colorIdx++ % COLORS.length];
  });

  // SVG: x방향=폭(1220), y방향=길이(2440) → 세로로 세운 원판
  const SVG_W = 160;                              // 1220mm → 160px
  const SVG_H = Math.round(SVG_W * 2440 / 1220); // 160 * 2 = 320px
  const scaleX = SVG_W / 1220;  // 1220 → 160px
  const scaleY = SVG_H / 2440;  // 2440 → 320px

  container.innerHTML = sheets.map((sheet, si) => {
    const usedArea = sheet.pieces.reduce((s,p) => s + p.w * p.h, 0);
    const eff = Math.round(usedArea / (1220 * 2440) * 100);

    // 절단선: y방향 가로 구분선 (각 컷 경계)
    const cutYSet = new Set();
    sheet.pieces.forEach(p => { if(p.y > 0) cutYSet.add(p.y); });
    const cutLines = [...cutYSet].map(y => {
      const sy = y * scaleY;
      return `<line x1="0" y1="${sy}" x2="${SVG_W}" y2="${sy}" stroke="#666" stroke-width="0.8" stroke-dasharray="2,2"/>`;
    }).join('');

    const rects = sheet.pieces.map(p => {
      const color = keyColorMap[p.name] || '#DDD';
      const px = p.x * scaleX;
      const py = p.y * scaleY;
      const pw = p.w * scaleX;
      const ph = p.h * scaleY;
      const label = `${p.origW}×${p.origH}`;
      const fs = Math.min(pw, ph) > 14 ? 7 : 5;
      return `
        <rect x="${px}" y="${py}" width="${pw}" height="${ph}"
          fill="${color}" stroke="#444" stroke-width="0.8" rx="1"/>
        <text x="${px+pw/2}" y="${py+ph/2}" text-anchor="middle" dominant-baseline="middle"
          font-size="${fs}" fill="#222" font-family="sans-serif" font-weight="600">${label}</text>`;
    }).join('');

    // 사용폭(x방향 최대값) 기준으로 사용/낭비 계산
    const maxX = sheet.pieces.reduce((m,p) => Math.max(m, p.x + p.w), 0);
    const usedXpx = maxX * scaleX;
    const wasteW = 1220 - maxX;  // x방향 미사용 폭

    return `<div style="margin-bottom:24px;display:inline-block;margin-right:16px;vertical-align:top">
      <div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:3px">
        원판 ${si+1}번 · 효율 ${eff}%
      </div>
      <div style="font-size:10px;color:var(--gray-500);margin-bottom:5px">
        사용 ${maxX}mm / 낭비 ${wasteW}mm
      </div>
      <div style="display:flex;align-items:flex-start;gap:4px">
        <svg width="${SVG_W}" height="${SVG_H}"
          style="border:1.5px solid #999;border-radius:4px;background:#F5F5F0;flex-shrink:0">
          ${rects}
          ${cutLines}
          ${wasteW > 0 ? `
            <rect x="${usedXpx}" y="0" width="${SVG_W - usedXpx}" height="${SVG_H}"
              fill="#E0E0D8" opacity="0.55"/>
            <line x1="${usedXpx}" y1="0" x2="${usedXpx}" y2="${SVG_H}"
              stroke="#CC3333" stroke-width="1.5" stroke-dasharray="4,3"/>` : ''}
          <rect x="0" y="0" width="${SVG_W}" height="${SVG_H}"
            fill="none" stroke="#888" stroke-width="1.5"/>
          <text x="2" y="${SVG_H - 3}" font-size="6" fill="#bbb" font-family="sans-serif">←1220→</text>
        </svg>
        <div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;color:#aaa;align-self:center;white-space:nowrap">
          2440mm
        </div>
      </div>
    </div>`;
  }).join('');

  // 가로 스크롤 가능한 래퍼로 감싸기
  container.innerHTML = `<div style="overflow-x:auto;white-space:nowrap;padding-bottom:8px">${container.innerHTML}</div>`;

  const legend = Object.entries(keyColorMap).map(([key, color]) => {
    const [name, type] = key.split('|');
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <div style="width:14px;height:14px;background:${color};border:1px solid #888;border-radius:2px;flex-shrink:0"></div>
      <span style="font-size:12px;color:var(--gray-700)">${name} <span style="color:#aaa;font-size:11px">(${type})</span></span>
    </div>`;
  }).join('');

  document.getElementById('cut-legend').innerHTML = legend;
  ovl.classList.add('show');
}


function calcDoorQuote() {
  const flat = getFlatDoorItems();
  if(flat.length===0){ alert('색상과 사이즈를 추가해주세요'); return; }
  const client = document.getElementById('door-client').value || '(거래처명)';
  const date = document.getElementById('door-date').value;

  // 색상별 그룹화
  const colorGroups = {};
  flat.forEach(it => {
    if(!colorGroups[it.key]) colorGroups[it.key] = [];
    for(let i=0; i<it.qty; i++) colorGroups[it.key].push({w:it.w, h:it.h, name:it.key});
  });

  // 배치도용 최적화
  lastSheets = optimizeCuts(
    Object.entries(colorGroups).flatMap(([key, pieces]) => {
      const unique = {};
      pieces.forEach(p => { const k=`${p.w}_${p.h}`; unique[k]=(unique[k]||0)+1; });
      return Object.entries(unique).map(([k,qty])=>{ const [w,h]=k.split('_'); return {w:+w,h:+h,qty,name:key}; });
    })
  );

  // 색상별 소요 원판 계산 (세로 스트립 방식)
  let rows = '';
  let total = 0;
  let totalSheetDecimal = 0;

  const colorSummary = Object.entries(colorGroups).map(([key, pieces]) => {
    const sheetDecimal = calcSheetDecimal(pieces);
    const unit = getUnitPrice(key);
    const amt = Math.round(sheetDecimal * unit);
    totalSheetDecimal += sheetDecimal;
    total += amt;
    const [colorName, colorType] = key.split('|');
    return {key, colorName, colorType, pieces, sheetDecimal, unit, amt};
  });

  colorSummary.forEach(({colorName, colorType, pieces, sheetDecimal, unit, amt}) => {
    rows += `<tr>
      <td>${colorName}<br><span style="font-size:11px;color:#888">${colorType}</span></td>
      <td style="text-align:center">${pieces.length}개 부재</td>
      <td style="text-align:center">${sheetDecimal}장</td>
      <td style="text-align:right">${unit.toLocaleString()}</td>
      <td style="text-align:right;font-weight:700">${amt.toLocaleString()}</td>
    </tr>`;
  });

  const totalSheetCount = lastSheets.length;
  // 소요량: totalSheetDecimal을 그대로 사용 (이미 올림 적용됨)
  const totalDecimalRounded = Math.round(totalSheetDecimal * 10) / 10;
  const totalPieceArea = flat.reduce((s,it)=>s+it.w*it.h*it.qty,0);
  const efficiency = totalSheetCount > 0 ? Math.round(totalPieceArea / (totalSheetCount * SHEET_H * SHEET_W) * 100) : 0;

  document.getElementById('door-preview-area').innerHTML = `
    <div class="pv-wrap">
      <div class="pv-title">도 &nbsp; 어 &nbsp; 발 &nbsp; 주</div>
      <div class="pv-info">
        <div class="pv-row"><span class="pv-k">거래처</span><span class="pv-v bold">${client}</span></div>
        <div class="pv-row"><span class="pv-k">견적일</span><span class="pv-v">${date}</span></div>
        <div class="pv-row"><span class="pv-k">원판규격</span><span class="pv-v">2440×1220mm · SUPER 레이저도어</span></div>
      </div>

      <button onclick="drawCutLayout(lastSheets)"
        style="width:100%;padding:13px;background:linear-gradient(135deg,#1A4F8A,#2563a8);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
        <span>📐 재단 배치도 보기</span>
        <span style="font-size:18px;background:rgba(255,255,255,0.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center">▶</span>
      </button>

      <div class="pv-table-wrap">
        <table class="pv-table">
          <thead><tr><th>색상명</th><th>부재수</th><th>원판(장)</th><th>단가/장</th><th>금액</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td colspan="4">합 &nbsp; 계</td><td>${total.toLocaleString()}</td></tr></tfoot>
        </table>
      </div>

      <div class="pv-bank">
        <div class="pv-bank-notice">⚠ &nbsp; 선 입 금 후 발 주</div>
        <div class="pv-bank-body">
          <div class="pv-bank-num">332-135674-04-011</div>
          <div class="pv-bank-info">기업은행 &nbsp;|&nbsp; 예금주: 주식회사 오션메이드</div>
        </div>
      </div>
      <div style="font-size:10px;color:#aaa;text-align:center;padding:6px 0">※ 입금확인 후 제작 · SUPER 레이저도어 제로조인트 기준</div>
    </div>`;
  document.getElementById('door-preview-ovl').classList.add('show');
  document.getElementById('door-preview-ovl').scrollTop = 0;
}
