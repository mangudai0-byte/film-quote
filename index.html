<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오션메이드 필름 견적서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #1A4F8A;
  --blue-light: #EAF1FA;
  --blue-mid: #2E6BB5;
  --orange: #D05A1A;
  --orange-light: #FDF0E8;
  --green: #1A7A4A;
  --green-light: #E8F7EF;
  --gray-900: #1A1A1A;
  --gray-700: #3D3D3D;
  --gray-500: #6B6B6B;
  --gray-300: #BBBBBB;
  --gray-100: #F4F4F2;
  --gray-50: #FAFAF8;
  --white: #FFFFFF;
  --border: #E0DDD8;
  --radius: 10px;
  --shadow: 0 1px 4px rgba(0,0,0,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #F0EDE8;
  color: var(--gray-900);
  min-height: 100vh;
}
header {
  background: var(--blue);
  color: white;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
header span { font-size: 12px; opacity: 0.7; }
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

/* CARDS */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow: hidden;
}
.card-header {
  background: var(--gray-50);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-header .icon {
  width: 28px; height: 28px;
  background: var(--blue);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 14px;
}
.card-header h2 { font-size: 14px; font-weight: 600; color: var(--gray-700); }
.card-body { padding: 20px; }

/* FORM */
.form-grid { display: grid; gap: 14px; }
.form-grid.g2 { grid-template-columns: 1fr 1fr; }
.form-grid.g3 { grid-template-columns: 2fr 1fr 1fr; }
.field label { font-size: 12px; color: var(--gray-500); font-weight: 500; display: block; margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 14px; font-family: inherit;
  background: var(--white); color: var(--gray-900);
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus {
  outline: none; border-color: var(--blue-mid);
  box-shadow: 0 0 0 3px rgba(46,107,181,0.1);
}

/* ITEMS */
.item-card {
  background: var(--gray-50);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  transition: box-shadow 0.15s;
}
.item-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

.item-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  background: white;
}
.item-num {
  width: 24px; height: 24px;
  background: var(--blue);
  color: white;
  border-radius: 50%;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.item-header select {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px; font-family: inherit;
  background: white; color: var(--gray-900);
}
.item-header select:focus { outline: none; border-color: var(--blue-mid); }
.del-btn {
  width: 30px; height: 30px;
  background: none; border: 1px solid #E0DDD8;
  border-radius: 6px; cursor: pointer;
  color: var(--gray-500); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.del-btn:hover { background: #FEE; border-color: #F99; color: #C33; }

.item-body { padding: 14px 16px; display: grid; gap: 12px; }

/* COLOR INPUT ROW */
.color-input-row { display: flex; gap: 10px; align-items: flex-end; }
.color-input-row .field { flex: 1; }

/* PRICE DISPLAY - 핵심 UI */
.price-display {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.price-box {
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.price-box.roll { background: var(--blue-light); border: 1.5px solid #B8CDE8; }
.price-box.cut  { background: var(--orange-light); border: 1.5px solid #E8C4A0; }

.price-box-left { flex: 1; }
.price-tag {
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.price-box.roll .price-tag { color: var(--blue); }
.price-box.cut  .price-tag { color: var(--orange); }

.price-value {
  font-size: 22px; font-weight: 700; line-height: 1;
}
.price-box.roll .price-value { color: var(--blue); }
.price-box.cut  .price-value { color: var(--orange); }

.price-unit { font-size: 12px; font-weight: 400; margin-left: 2px; }
.price-input-wrap { flex: 0 0 90px; }
.price-input-wrap input {
  width: 100%; padding: 7px 8px;
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 6px;
  font-size: 13px; font-family: inherit;
  background: white; color: var(--gray-900);
  text-align: right;
}
.price-input-wrap input:focus { outline: none; border-color: var(--blue-mid); }

/* QTY ROW */
.qty-row {
  display: flex; align-items: center; gap: 12px;
  background: white; border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
}
.qty-label { font-size: 13px; font-weight: 600; color: var(--gray-700); min-width: 60px; }
.qty-stepper { display: flex; align-items: center; gap: 0; }
.qty-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  background: var(--gray-50); cursor: pointer;
  font-size: 18px; color: var(--gray-700);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s;
}
.qty-btn:first-child { border-radius: 7px 0 0 7px; }
.qty-btn:last-child  { border-radius: 0 7px 7px 0; }
.qty-btn:hover { background: var(--blue-light); color: var(--blue); }
.qty-input {
  width: 64px; height: 34px;
  border: 1px solid var(--border); border-left: none; border-right: none;
  text-align: center; font-size: 15px; font-weight: 600;
  font-family: inherit; color: var(--gray-900); background: white;
}
.qty-input:focus { outline: none; background: var(--blue-light); }
.qty-unit { font-size: 13px; color: var(--gray-500); }
.qty-shortcuts { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.qty-short-btn {
  padding: 4px 10px; font-size: 12px; font-family: inherit;
  border: 1px solid var(--border); border-radius: 5px;
  background: white; cursor: pointer; color: var(--gray-700);
  transition: all 0.1s;
}
.qty-short-btn:hover { background: var(--blue); color: white; border-color: var(--blue); }

/* BREAKDOWN */
.breakdown-row {
  background: white; border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
}
.breakdown-title { font-size: 12px; color: var(--gray-500); margin-bottom: 8px; font-weight: 500; }
.breakdown-items { display: flex; gap: 8px; flex-wrap: wrap; }
.breakdown-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 6px;
  font-size: 13px; font-weight: 500;
}
.breakdown-chip.roll-chip { background: var(--blue-light); color: var(--blue); }
.breakdown-chip.cut-chip  { background: var(--orange-light); color: var(--orange); }
.breakdown-chip.only-chip { background: var(--green-light); color: var(--green); }
.chip-tag { font-size: 11px; font-weight: 700; opacity: 0.7; }
.chip-amt { font-size: 14px; font-weight: 700; }
.breakdown-total {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 8px;
}
.breakdown-total .label { font-size: 12px; color: var(--gray-500); }
.breakdown-total .val { font-size: 20px; font-weight: 700; color: var(--gray-900); }

/* ADD BUTTON */
.add-btn {
  width: 100%; padding: 13px;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  background: none; cursor: pointer;
  font-size: 14px; font-family: inherit;
  color: var(--gray-500);
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.add-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

/* TOTAL FOOTER */
.total-bar {
  background: var(--blue);
  border-radius: var(--radius);
  padding: 18px 24px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
  color: white;
}
.total-bar .label { font-size: 15px; font-weight: 500; opacity: 0.85; }
.total-bar .amount { font-size: 28px; font-weight: 700; }

/* ACTION BUTTONS */
.actions { display: flex; gap: 10px; }
.btn-reset {
  padding: 12px 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: white; cursor: pointer;
  font-size: 14px; font-family: inherit;
  color: var(--gray-700);
  transition: all 0.15s;
}
.btn-reset:hover { background: var(--gray-100); }
.btn-preview {
  flex: 1; padding: 14px;
  background: var(--blue); color: white;
  border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: background 0.15s;
}
.btn-preview:hover { background: #163F6E; }

/* MODAL */
.ovl {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 200;
  align-items: flex-start; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.ovl.show { display: flex; }
.modal {
  background: white;
  border-radius: 12px;
  width: 720px; max-width: 100%;
  margin: auto;
}
.modal-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
}
.modal-bar h3 { font-size: 15px; font-weight: 600; }
.modal-actions { display: flex; gap: 8px; align-items: center; }
.btn-print {
  padding: 7px 18px;
  background: var(--blue); color: white;
  border: none; border-radius: 7px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer;
}
.btn-print:hover { background: #163F6E; }
.close-btn {
  width: 32px; height: 32px;
  background: none; border: 1px solid var(--border);
  border-radius: 7px; cursor: pointer;
  font-size: 20px; color: var(--gray-500);
  display: flex; align-items: center; justify-content: center;
}
.parea { padding: 32px 36px; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }

/* PRINT STYLES */
.ptitle { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 8px; margin-bottom: 22px; }
.pmeta { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid #333; margin-bottom: 14px; }
.pml { border-right: 1.5px solid #333; padding: 12px 16px; }
.pmr { padding: 12px 16px; }
.mrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; font-size: 13px; color: #222; }
.mk { min-width: 80px; color: #666; font-size: 12px; }
.stbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.stbl td { padding: 4px 8px; border: 0.5px solid #bbb; }
.stbl .sk { color: #666; background: #f5f5f5; width: 80px; }
.ptbl { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
.ptbl th { background: #f0f0f0; border: 1px solid #999; padding: 8px; font-weight: 700; text-align: center; }
.ptbl td { border: 1px solid #ccc; padding: 7px 10px; }
.ptbl .sub-row td { font-size: 12px; color: #555; background: #fafafa; }
.psum td { font-weight: 700; background: #f0f0f0; font-size: 14px; }
.pbank { font-size: 12px; margin-top: 12px; padding: 10px 14px; background: #f5f5f5; border-radius: 5px; }
.pnote { font-size: 11px; color: #888; margin-top: 10px; }

/* GROUP LABEL */
.group-badge {
  display: inline-block; font-size: 10px; padding: 2px 7px;
  border-radius: 4px; background: var(--gray-100); color: var(--gray-500);
  font-weight: 600; margin-left: 6px; vertical-align: middle;
}

@media (max-width: 600px) {
  .form-grid.g2, .form-grid.g3 { grid-template-columns: 1fr; }
  .price-display { grid-template-columns: 1fr; }
  .qty-shortcuts { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>🎬 오션메이드 필름 견적서</h1>
  <span>예림 인테리어 필름 단가표 25.12 기준</span>
</header>

<div class="container">

  <!-- 거래처 -->
  <div class="card">
    <div class="card-header">
      <div class="icon">📋</div>
      <h2>거래처 정보</h2>
    </div>
    <div class="card-body">
      <div class="form-grid g2">
        <div class="field"><label>거래처명</label><input id="client" type="text" placeholder="예: 새로이홈"></div>
        <div class="field"><label>현장명 (선택)</label><input id="site" type="text" placeholder="예: 부영아파트 401호"></div>
      </div>
      <div class="form-grid g3" style="margin-top:14px">
        <div class="field"><label>접수일</label><input id="rdate" type="date"></div>
        <div class="field"><label>출고일</label><input id="sdate" type="date"></div>
        <div class="field"><label>출고방식</label>
          <select id="smethod">
            <option>직접출고</option><option>택배</option><option>방문수령</option><option>기타</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 품목 -->
  <div class="card">
    <div class="card-header">
      <div class="icon">🎞</div>
      <h2>품목</h2>
    </div>
    <div class="card-body">
      <div id="items-wrap"></div>
      <button class="add-btn" onclick="addItem()">＋ 품목 추가</button>
    </div>
  </div>

  <!-- 합계 -->
  <div class="total-bar">
    <span class="label">총 합계</span>
    <span class="amount" id="total-display">0 원</span>
  </div>

  <!-- 액션 -->
  <div class="actions">
    <button class="btn-reset" onclick="resetForm()">↺ 초기화</button>
    <button class="btn-preview" onclick="showPreview()">견적서 미리보기 →</button>
  </div>
</div>

<!-- 미리보기 모달 -->
<div class="ovl" id="ovl">
  <div class="modal">
    <div class="modal-bar">
      <h3>견적서 미리보기</h3>
      <div class="modal-actions">
        <button class="btn-print" onclick="doPrint()">🖨 인쇄 / PDF 저장</button>
        <button class="close-btn" onclick="closePreview()">×</button>
      </div>
    </div>
    <div class="parea" id="parea"></div>
  </div>
</div>

<script>
const ROLL_M = 25;

const PRODUCTS = [
  {label:'HSM 슈퍼매트 (01-34)', group:'솔리드', roll:7600, cut:10400},
  {label:'HA 슈퍼매트 (911)', group:'솔리드', roll:7600, cut:10400},
  {label:'HS 솔리드 (001-053)', group:'솔리드', roll:5200, cut:8000},
  {label:'HE 텍스처/펄 (401-406)', group:'솔리드', roll:5400, cut:8400},
  {label:'HE 텍스처/펄 (407)', group:'솔리드', roll:7600, cut:11800},
  {label:'HP 페인티드우드 (505-517)', group:'솔리드', roll:5200, cut:8000},
  {label:'HP 페인티드우드 (501-504, 518-540)', group:'솔리드', roll:5400, cut:8400},
  {label:'HW 우드 (얇은글씨)', group:'우드', roll:5400, cut:8400},
  {label:'HWB 우드 (굵은글씨)', group:'우드', roll:5800, cut:8900},
  {label:'HPW 키친우드 (20-24)', group:'우드', roll:5400, cut:8400},
  {label:'HN 스톤 (2001-2013)', group:'스톤', roll:5800, cut:8900},
  {label:'HM 마블 (2101-2104)', group:'마블', roll:5800, cut:8900},
  {label:'HT 메탈 (2301-2309)', group:'메탈', roll:6000, cut:9200},
  {label:'HF 패브릭 (2201-2210)', group:'패브릭', roll:5800, cut:8900},
  {label:'HCP 세라믹 (01-04)', group:'세라믹', roll:5800, cut:8900},
  {label:'HLC 콘크리트 (010-011)', group:'콘크리트', roll:5800, cut:8900},
  {label:'HC 솔리드향균 (801-804)', group:'향균', roll:5200, cut:8000},
  {label:'HLC 우드향균 (1851-1852)', group:'향균', roll:5400, cut:8400},
  {label:'HR 리얼우드 (3001-3008)', group:'프리미엄우드', roll:10900, cut:16900},
  {label:'HU 리얼터치우드 (3301-3304)', group:'프리미엄우드', roll:12800, cut:19800},
  {label:'HI PP SOLID (4001, 4002)', group:'프리미엄우드', roll:14000, cut:21600},
  {label:'HO PP WOOD (4301-4303)', group:'프리미엄우드', roll:14000, cut:21600},
];

let items = [];
let itemCounter = 0;

function todayStr() { return new Date().toISOString().slice(0,10); }
document.getElementById('rdate').value = todayStr();
document.getElementById('sdate').value = todayStr();

function calcAmt(qty, rollP, cutP) {
  if (qty <= 0) return { amt: 0, rollM: 0, cutM: 0 };
  const rolls = Math.floor(qty / ROLL_M);
  const rem = qty % ROLL_M;
  const rollM = rolls * ROLL_M;
  const cutM = rem;
  const amt = rollM * rollP + cutM * cutP;
  return { amt, rollM, cutM };
}

function groupedOptions() {
  const groups = {};
  PRODUCTS.forEach((p, i) => {
    if (!groups[p.group]) groups[p.group] = [];
    groups[p.group].push({ ...p, idx: i });
  });
  let html = '';
  for (const [grp, prods] of Object.entries(groups)) {
    html += `<optgroup label="── ${grp} ──">`;
    prods.forEach(p => {
      html += `<option value="${p.idx}">${p.label}</option>`;
    });
    html += `</optgroup>`;
  }
  return html;
}

function addItem() {
  const id = itemCounter++;
  items.push({ id, pidx: 0, color: '', qty: 5, customRoll: PRODUCTS[0].roll, customCut: PRODUCTS[0].cut });
  renderAll();
}

function removeItem(id) {
  items = items.filter(it => it.id !== id);
  renderAll();
}

function getItem(id) { return items.find(it => it.id === id); }

function renderAll() {
  const wrap = document.getElementById('items-wrap');
  wrap.innerHTML = '';
  let total = 0;
  items.forEach((it, idx) => {
    const { amt } = calcAmt(it.qty, it.customRoll, it.customCut);
    total += amt;
    wrap.appendChild(buildItemEl(it, idx + 1));
  });
  document.getElementById('total-display').textContent = total.toLocaleString() + ' 원';
}

function buildItemEl(it, num) {
  const p = PRODUCTS[it.pidx];
  const { amt, rollM, cutM } = calcAmt(it.qty, it.customRoll, it.customCut);

  const div = document.createElement('div');
  div.className = 'item-card';
  div.dataset.id = it.id;

  // breakdown chips
  let breakdownHtml = '';
  if (it.qty > 0) {
    if (rollM > 0 && cutM > 0) {
      breakdownHtml = `
        <div class="breakdown-chip roll-chip">
          <span class="chip-tag">롤</span>
          <span>${rollM}m × ${it.customRoll.toLocaleString()} =</span>
          <span class="chip-amt">${(rollM * it.customRoll).toLocaleString()}원</span>
        </div>
        <div style="font-size:18px;color:#ccc;align-self:center">+</div>
        <div class="breakdown-chip cut-chip">
          <span class="chip-tag">절단</span>
          <span>${cutM}m × ${it.customCut.toLocaleString()} =</span>
          <span class="chip-amt">${(cutM * it.customCut).toLocaleString()}원</span>
        </div>`;
    } else if (rollM > 0) {
      breakdownHtml = `
        <div class="breakdown-chip roll-chip">
          <span class="chip-tag">롤</span>
          <span>${rollM}m × ${it.customRoll.toLocaleString()} =</span>
          <span class="chip-amt">${amt.toLocaleString()}원</span>
        </div>`;
    } else {
      breakdownHtml = `
        <div class="breakdown-chip cut-chip">
          <span class="chip-tag">절단</span>
          <span>${cutM}m × ${it.customCut.toLocaleString()} =</span>
          <span class="chip-amt">${amt.toLocaleString()}원</span>
        </div>`;
    }
  }

  div.innerHTML = `
    <div class="item-header">
      <div class="item-num">${num}</div>
      <select onchange="onProductChange(${it.id}, this.value)">${groupedOptions()}</select>
      <button class="del-btn" onclick="removeItem(${it.id})">×</button>
    </div>
    <div class="item-body">

      <div class="color-input-row">
        <div class="field" style="flex:1">
          <label>색상명 직접입력 <span class="group-badge">${p.group}</span></label>
          <input type="text" value="${it.color}" placeholder="예: HWB1064 오크딥" oninput="onColorChange(${it.id}, this.value)">
        </div>
      </div>

      <div class="price-display">
        <div class="price-box roll">
          <div class="price-box-left">
            <div class="price-tag">롤 단가 (25m 이상)</div>
            <div class="price-value">${it.customRoll.toLocaleString()}<span class="price-unit">원/m</span></div>
          </div>
          <div class="price-input-wrap">
            <label style="font-size:11px;color:#1A4F8A;display:block;margin-bottom:3px">수정</label>
            <input type="number" value="${it.customRoll}" oninput="onPriceChange(${it.id},'roll',this.value)">
          </div>
        </div>
        <div class="price-box cut">
          <div class="price-box-left">
            <div class="price-tag">절단 단가 (25m 미만)</div>
            <div class="price-value">${it.customCut.toLocaleString()}<span class="price-unit">원/m</span></div>
          </div>
          <div class="price-input-wrap">
            <label style="font-size:11px;color:#D05A1A;display:block;margin-bottom:3px">수정</label>
            <input type="number" value="${it.customCut}" oninput="onPriceChange(${it.id},'cut',this.value)">
          </div>
        </div>
      </div>

      <div class="qty-row">
        <span class="qty-label">수 량</span>
        <div class="qty-stepper">
          <button class="qty-btn" onclick="changeQty(${it.id}, -5)">−</button>
          <input class="qty-input" type="number" value="${it.qty}" min="0" step="5" oninput="onQtyChange(${it.id}, this.value)">
          <button class="qty-btn" onclick="changeQty(${it.id}, 5)">＋</button>
        </div>
        <span class="qty-unit">m</span>
        <div class="qty-shortcuts">
          ${[5,10,15,20,25,30,40,50].map(q=>`<button class="qty-short-btn" onclick="setQty(${it.id},${q})">${q}m</button>`).join('')}
        </div>
      </div>

      <div class="breakdown-row">
        <div class="breakdown-title">계산 내역</div>
        <div class="breakdown-items">${breakdownHtml}</div>
        <div class="breakdown-total">
          <span class="label">소계</span>
          <span class="val">${amt.toLocaleString()} 원</span>
        </div>
      </div>

    </div>
  `;

  div.querySelector('select').value = it.pidx;
  return div;
}

function onProductChange(id, pidx) {
  const it = getItem(id);
  it.pidx = Number(pidx);
  const p = PRODUCTS[it.pidx];
  it.customRoll = p.roll;
  it.customCut = p.cut;
  renderAll();
}
function onColorChange(id, val) { getItem(id).color = val; updateTotal(); }
function onPriceChange(id, field, val) {
  const it = getItem(id);
  if (field === 'roll') it.customRoll = Number(val) || 0;
  else it.customCut = Number(val) || 0;
  renderAll();
}
function onQtyChange(id, val) { getItem(id).qty = Number(val) || 0; renderAll(); }
function changeQty(id, delta) {
  const it = getItem(id);
  it.qty = Math.max(0, it.qty + delta);
  renderAll();
}
function setQty(id, val) { getItem(id).qty = val; renderAll(); }
function updateTotal() {
  const total = items.reduce((s, it) => s + calcAmt(it.qty, it.customRoll, it.customCut).amt, 0);
  document.getElementById('total-display').textContent = total.toLocaleString() + ' 원';
}

function resetForm() {
  if (items.length > 0 && !confirm('초기화하시겠습니까?')) return;
  document.getElementById('client').value = '';
  document.getElementById('site').value = '';
  document.getElementById('rdate').value = todayStr();
  document.getElementById('sdate').value = todayStr();
  document.getElementById('smethod').value = '직접출고';
  items = []; itemCounter = 0;
  renderAll();
}
