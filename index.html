<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오션메이드 필름 견적서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
:root {
  --pk-red:    #E8340A;
  --pk-yellow: #FFCB05;
  --pk-blue:   #3B5FA0;
  --pk-dark:   #1A1A2E;
  --pk-white:  #FFFFFF;
  --blue:      #3B5FA0;
  --blue-light:#E8EEF8;
  --blue-mid:  #4A72C4;
  --orange:    #E8340A;
  --orange-light:#FEE8E4;
  --green:     #3DAA59;
  --green-light:#E4F5E9;
  --yellow:    #FFCB05;
  --gray-900:  #1A1A2E;
  --gray-700:  #2D2D4A;
  --gray-500:  #6B6B8A;
  --gray-100:  #F0F0F8;
  --gray-50:   #F8F8FC;
  --white:     #FFFFFF;
  --border:    #D0D0E4;
  --radius:    12px;
  --shadow-sm: 0 2px 8px rgba(59,95,160,0.10);
  --shadow:    0 4px 16px rgba(59,95,160,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Noto Sans KR',sans-serif;
  background: #E8EBF5 url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='12' fill='none' stroke='%23FFFFFF' stroke-width='1.5' opacity='0.15'/%3E%3Cline x1='8' y1='20' x2='32' y2='20' stroke='%23FFFFFF' stroke-width='1.5' opacity='0.12'/%3E%3C/svg%3E");
  color:var(--gray-900); min-height:100vh;
}

/* ── 헤더 ── */
header{
  background:linear-gradient(135deg, var(--pk-red) 0%, #C02000 60%, var(--pk-dark) 100%);
  color:white; padding:0 18px; height:58px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:50;
  box-shadow:0 3px 16px rgba(232,52,10,.45);
  border-bottom:3px solid var(--pk-yellow);
}
header::after{
  content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:32px; height:32px; border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.1);
  pointer-events:none;
}
header h1{font-size:15px;font-weight:800;letter-spacing:.3px;z-index:1;}

/* ── 레이아웃 ── */
.container{max-width:540px;margin:0 auto;padding:16px 14px 100px;}

/* ── 카드 ── */
.card{
  background:var(--white); border-radius:var(--radius);
  margin-bottom:14px; overflow:hidden;
  border:2px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.card-header{
  background:linear-gradient(to right,#EEF2F8,#F2F0FC);
  border-bottom:2px solid var(--border); padding:12px 18px;
  display:flex; align-items:center; gap:10px;
}
.card-header .icon{
  width:28px;height:28px;
  background:linear-gradient(135deg,var(--pk-red),#C02000);
  border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:14px; box-shadow:0 2px 6px rgba(232,52,10,.3);
  border:1.5px solid rgba(255,255,255,.3);
}
.card-header h2{font-size:13px;font-weight:700;color:var(--gray-700);}
.card-body{padding:16px 18px;}

/* ── 폼 ── */
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{font-size:10px;color:var(--gray-500);font-weight:700;display:block;margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase;}
.field input,.field select{
  width:100%;padding:11px 14px;
  border:2px solid var(--border);border-radius:10px;
  font-size:14px;font-family:inherit;background:var(--white);color:var(--gray-900);
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue-mid);box-shadow:0 0 0 3px rgba(74,114,196,.15);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── 아이템 카드 ── */
.item-card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-sm);}
.item-row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:white;}
.item-num{
  width:24px;height:24px;flex-shrink:0;
  background:var(--pk-red);color:white;
  border-radius:50%;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--pk-yellow);
  box-shadow:0 2px 6px rgba(232,52,10,.3);
}
.item-row-info{flex:1;min-width:0;}
.item-row-name{font-size:13px;font-weight:700;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-row-sub{font-size:11px;color:var(--gray-500);margin-top:1px;}
.item-row-amt{font-size:14px;font-weight:800;color:var(--blue);white-space:nowrap;flex-shrink:0;}
.item-expand-btn{width:26px;height:26px;flex-shrink:0;background:var(--gray-50);border:1.5px solid var(--border);border-radius:6px;font-size:11px;color:var(--gray-500);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.del-btn{width:28px;height:28px;flex-shrink:0;background:none;border:1.5px solid #FFAAAA;border-radius:6px;font-size:15px;color:var(--pk-red);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.item-detail{border-top:2px solid var(--border);background:#FAFAFC;}
.item-detail.hidden{display:none;}
.item-body{padding:14px;display:flex;flex-direction:column;gap:12px;}

/* ── 셀렉트 ── */
.sel-group{display:flex;flex-direction:column;gap:8px;}
.sel-block{position:relative;}
.sel-block label{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;display:block;margin-bottom:5px;}
.sel-block.cat label{color:var(--blue);}
.sel-block.model label{color:#1A6A3A;}
.sel-block::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;margin-top:8px;}
.sel-block.cat::after{color:var(--blue);}
.sel-block.model::after{color:#1A6A3A;}
.sel-block select{width:100%;padding:11px 36px 11px 14px;border-radius:10px;font-size:14px;font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;font-weight:600;}
.sel-block.cat select{border:2px solid #A8C4E8;background:linear-gradient(to bottom,#EAF1FA,#DDE8F5);color:var(--blue);}
.sel-block.cat select:focus{outline:none;border-color:var(--blue);}
.sel-block.model select{border:2px solid #A8CEB8;background:linear-gradient(to bottom,#EEF6F0,#E2F0E6);color:#1A5A2A;}
.sel-block.model select:focus{outline:none;border-color:#1A6A3A;}

/* ── 단가 박스 ── */
.price-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.price-box{border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
.price-box.roll{background:linear-gradient(135deg,#EAF1FA,#DAE8F5);border:2px solid #A8C4E8;}
.price-box.cut{background:linear-gradient(135deg,#FEE8E4,#F8D4CC);border:2px solid #E8C0B0;}
.price-tag{font-size:10px;font-weight:700;letter-spacing:.3px;}
.price-box.roll .price-tag{color:var(--blue);}
.price-box.cut .price-tag{color:var(--pk-red);}
.price-val{font-size:22px;font-weight:800;line-height:1.1;}
.price-box.roll .price-val{color:var(--blue);}
.price-box.cut .price-val{color:var(--pk-red);}
.price-unit-txt{font-size:11px;font-weight:500;opacity:.7;}
.price-locked{display:flex;align-items:center;gap:3px;font-size:10px;color:rgba(0,0,0,.28);margin-top:2px;}
.price-locked::before{content:'🔒';font-size:9px;}

/* ── 수량 ── */
.qty-box{background:var(--gray-50);border:2px solid var(--border);border-radius:12px;padding:12px 14px;}
.qty-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.qty-label{font-size:12px;font-weight:700;color:var(--gray-700);}
.qty-stepper{display:flex;align-items:center;margin-left:auto;border-radius:10px;overflow:hidden;border:2px solid var(--border);}
.qty-btn{width:40px;height:40px;border:none;background:white;font-size:20px;color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qty-btn:active{background:var(--blue-light);}
.qty-input{width:58px;height:40px;border:none;border-left:2px solid var(--border);border-right:2px solid var(--border);text-align:center;font-size:16px;font-weight:700;font-family:inherit;color:var(--gray-900);background:white;}
.qty-input:focus{outline:none;background:var(--blue-light);}
.qty-unit{font-size:13px;color:var(--gray-500);margin-left:6px;font-weight:500;}
.qty-shorts{display:flex;gap:6px;flex-wrap:wrap;}
.qty-short{padding:6px 11px;font-size:12px;font-family:inherit;font-weight:700;border:2px solid var(--border);border-radius:8px;background:white;color:var(--gray-700);cursor:pointer;}
.qty-short:active{background:var(--blue);color:white;border-color:var(--blue);}

/* ── 계산 내역 ── */
.breakdown{background:white;border:2px solid var(--border);border-radius:12px;padding:12px 14px;}
.bd-title{font-size:10px;font-weight:700;color:var(--gray-500);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
.bd-chips{display:flex;flex-direction:column;gap:7px;}
.bd-chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:9px;}
.bd-chip.roll-chip{background:linear-gradient(to right,#EAF1FA,#DFF0FF);}
.bd-chip.cut-chip{background:linear-gradient(to right,#FEE8E4,#FFF0EC);}
.bd-chip .chip-left{display:flex;align-items:center;gap:7px;}
.bd-chip .chip-tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;}
.roll-chip .chip-tag{background:var(--blue);color:white;}
.cut-chip .chip-tag{background:var(--pk-red);color:white;}
.bd-chip .chip-desc{font-size:12px;color:var(--gray-700);}
.bd-chip .chip-amt{font-size:14px;font-weight:700;}
.roll-chip .chip-amt{color:var(--blue);}
.cut-chip .chip-amt{color:var(--pk-red);}
.bd-total{margin-top:10px;padding-top:10px;border-top:2px dashed var(--border);display:flex;justify-content:space-between;align-items:baseline;}
.bd-total .lbl{font-size:12px;color:var(--gray-500);font-weight:600;}
.bd-total .val{font-size:22px;font-weight:800;color:var(--gray-900);}

/* ── 확정 버튼 ── */
.confirm-item-btn{width:100%;padding:13px;background:linear-gradient(135deg,#3DAA59,#2E8A45);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(61,170,89,.3);}

/* ── 추가 버튼 ── */
.add-btn{width:100%;padding:15px;border:2px dashed #B0B8D8;border-radius:var(--radius);background:rgba(232,238,248,.4);font-size:14px;font-family:inherit;color:var(--blue);cursor:pointer;font-weight:700;}
.add-btn:active{border-color:var(--blue);background:var(--blue-light);}

/* ── 합계 바 (포켓볼 스타일) ── */
.total-bar{
  background:linear-gradient(135deg,var(--pk-red),#C02000);
  border-radius:var(--radius);padding:18px 22px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;color:white;
  box-shadow:0 4px 18px rgba(232,52,10,.4);
  border:2.5px solid var(--pk-yellow);
  position:relative;overflow:hidden;
}
.total-bar::before{
  content:'';position:absolute;right:-20px;top:-20px;
  width:80px;height:80px;border-radius:50%;
  border:12px solid rgba(255,203,5,.15);
}
.total-bar .lbl{font-size:14px;opacity:.9;font-weight:600;z-index:1;}
.total-bar .amt{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--pk-yellow);z-index:1;}

/* ── 액션 버튼 ── */
.actions{display:flex;gap:10px;}
.btn-reset{padding:14px 22px;border:2px solid var(--border);border-radius:var(--radius);background:white;font-size:14px;font-family:inherit;color:var(--gray-700);cursor:pointer;font-weight:700;}
.btn-preview{
  flex:1;padding:15px;
  background:linear-gradient(135deg,var(--pk-blue),#4A72C4);
  color:white;border:none;border-radius:var(--radius);
  font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
  box-shadow:0 4px 14px rgba(59,95,160,.35);
  border:2px solid rgba(255,255,255,.2);
}
.btn-print{flex:1;padding:14px;background:linear-gradient(135deg,var(--pk-blue),#4A72C4);color:white;border:none;border-radius:var(--radius);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
.btn-confirm{flex:1;padding:14px;background:linear-gradient(135deg,#3DAA59,#2E8A45);color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}

/* ── 비밀번호 화면 ── */
.pw-screen{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(160deg,var(--pk-dark) 0%,#2A2A5A 40%,var(--pk-blue) 100%);
  display:flex;align-items:center;justify-content:center;
}
.pw-screen.hidden{display:none;}
.pw-box{
  background:rgba(255,255,255,.96);border-radius:24px;
  padding:36px 28px;width:310px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  border:3px solid var(--pk-yellow);
}
.pw-title{font-size:20px;font-weight:800;color:var(--gray-900);margin-bottom:4px;}
.pw-sub{font-size:13px;color:var(--gray-500);margin-bottom:24px;}
.pw-input{width:100%;padding:13px;border:2px solid var(--border);border-radius:12px;font-size:18px;text-align:center;font-family:inherit;margin-bottom:12px;letter-spacing:6px;}
.pw-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,95,160,.15);}
.pw-btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--pk-red),#C02000);
  color:white;border:2px solid var(--pk-yellow);
  border-radius:12px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
  box-shadow:0 4px 14px rgba(232,52,10,.4);
}
.pw-error{color:var(--pk-red);font-size:13px;font-weight:600;margin-top:10px;opacity:0;transition:opacity .2s;}
.pw-error.show{opacity:1;}

/* ── 모달 ── */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(26,26,46,.75);overflow-y:auto;display:none;}
.ovl.show{display:block;}
.modal{background:white;max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.modal-bar{
  background:linear-gradient(135deg,var(--pk-red),#C02000);
  padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
  border-bottom:3px solid var(--pk-yellow);
}
.modal-bar h3{font-size:15px;font-weight:800;color:white;}
.close-btn{height:36px;padding:0 12px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:8px;font-size:14px;color:white;font-weight:700;display:flex;align-items:center;cursor:pointer;white-space:nowrap;}
.parea{flex:1;overflow-y:auto;padding:16px;}

/* ── 견적서 미리보기 (인쇄용) ── */
.pv-wrap{padding:6px 0 24px;}
.pv-title{text-align:center;font-size:20px;font-weight:800;letter-spacing:6px;color:var(--pk-blue);margin-bottom:12px;padding-bottom:12px;border-bottom:3px solid var(--pk-red);}
.pv-info{border:2px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.pv-row{display:flex;align-items:baseline;padding:9px 14px;border-bottom:1px solid #EEE;font-size:13px;}
.pv-row:last-child{border-bottom:none;}
.pv-k{color:#999;font-size:11px;min-width:60px;font-weight:600;}
.pv-v{color:#111;font-weight:500;flex:1;}
.pv-v.bold{font-size:16px;font-weight:800;}
.pv-table-wrap{border:2px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.pv-table{width:100%;border-collapse:collapse;font-size:13px;}
.pv-table thead tr{background:var(--pk-blue);}
.pv-table th{padding:9px 6px;color:white;font-size:11px;font-weight:700;}
.pv-table th:first-child{text-align:left;padding-left:12px;}
.pv-table th:nth-child(n+2){text-align:right;padding-right:8px;}
.pv-table td{padding:10px 6px;border-bottom:1px solid #F0EDE8;color:#111;}
.pv-table td:first-child{text-align:left;padding-left:12px;font-weight:700;}
.pv-table td:nth-child(n+2){text-align:right;padding-right:8px;}
.pv-table tbody tr:nth-child(even){background:#FAFAFC;}
.sub-row td{font-size:12px!important;font-weight:400!important;color:#AAA!important;background:#F8F8FA!important;}
.pv-table tfoot td{padding:12px 6px;background:#FEF0EC;border-top:2px solid var(--pk-red);font-weight:800;color:var(--pk-red);font-size:15px;}
.pv-table tfoot td:first-child{padding-left:12px;}
.pv-table tfoot td:last-child{text-align:right;padding-right:8px;font-size:18px;}
.pv-bank{border:2px solid var(--pk-red);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.pv-bank-notice{background:var(--pk-red);color:white;text-align:center;padding:9px;font-size:13px;font-weight:800;letter-spacing:4px;}
.pv-bank-body{padding:12px 16px;}
.pv-bank-num{font-size:22px;font-weight:800;color:var(--pk-blue);letter-spacing:1px;margin-bottom:4px;}
.pv-bank-info{font-size:12px;color:#666;}
.pv-supplier{text-align:center;padding:8px;background:var(--gray-50);border-radius:8px;font-size:12px;color:#888;font-weight:600;margin-bottom:4px;}
.pv-supplier-body{border:1.5px solid var(--border);border-radius:8px;overflow:hidden;}
.pv-supplier-body.hidden{display:none;}

/* ── 반응형 인쇄 ── */
@media print{
  .modal{min-height:unset;}
  .parea{padding:10px;}
}
</style>
</head>
<body>

        <ellipse cx="54" cy="49" rx="2.5" ry="2.5" fill="white"/>
        <ellipse cx="78" cy="52" rx="7" ry="8" fill="#2C3E50"/>
        <ellipse cx="80" cy="49" rx="2.5" ry="2.5" fill="white"/>
        <ellipse cx="43" cy="62" rx="9" ry="7" fill="#E74C3C" opacity="0.85"/>
        <ellipse cx="87" cy="62" rx="9" ry="7" fill="#E74C3C" opacity="0.85"/>

<script>
// ===== 비밀번호 =====
const PASSWORD = '8253';
function checkPw(){
  const val = document.getElementById('pw-input').value;
  if(val === PASSWORD){
    document.getElementById('pw-screen').classList.add('hidden');
    document.getElementById('mode-screen').style.display = 'flex';
    sessionStorage.setItem('auth','1');
  } else {
    const err = document.getElementById('pw-error');
    err.classList.add('show');
    document.getElementById('pw-input').value='';
    setTimeout(()=>err.classList.remove('show'), 2000);
  }
}
if(sessionStorage.getItem('auth')==='1'){
  document.getElementById('pw-screen').classList.add('hidden');
  document.getElementById('mode-screen').style.display='flex';
}
setTimeout(()=>{ const i=document.getElementById('pw-input'); if(i) i.focus(); }, 100);

// ===== 제품 데이터 =====
const ROLL_M = 25;
const PRODUCTS = [
  {name:'HSM 슈퍼매트',    roll:7600,  cut:10400},
  {name:'HS 솔리드',       roll:5200,  cut:8000},
  {name:'HP 페인티드우드(저가)',roll:5200,cut:8000},
  {name:'HP 페인티드우드(고가)',roll:5400,cut:8400},
  {name:'HE 텍스처/펄',    roll:5400,  cut:8400},
  {name:'HE407',           roll:7600,  cut:11800},
  {name:'HC 솔리드항균',   roll:5200,  cut:8000},
  {name:'HL 우드항균',     roll:5400,  cut:8400},
  {name:'HW 우드얇',       roll:5400,  cut:8400},
  {name:'HWB 우드굵',      roll:5800,  cut:8900},
  {name:'HPW 키친우드',    roll:5400,  cut:8400},
  {name:'HN 스톤',         roll:5800,  cut:8900},
  {name:'HM 마블',         roll:5800,  cut:8900},
  {name:'HT 메탈',         roll:6000,  cut:9200},
  {name:'HF 패브릭',       roll:5800,  cut:8900},
  {name:'HCP 세라믹',      roll:5800,  cut:8900},
  {name:'HLC 콘크리트',    roll:5800,  cut:8900},
  {name:'HR 리얼우드',     roll:10900, cut:16900},
  {name:'HU 리얼터치우드', roll:12800, cut:19800},
  {name:'HI PP SOLID',     roll:14000, cut:21600},
  {name:'HO PP WOOD',      roll:14000, cut:21600},
];
const MODEL_DB = {};
(function(){
  const cats = {
    'HSM 슈퍼매트': {pidx:0, models:['HSM001W 화이트','HSM002S 아이보리','HSM003G 그레이','HSM004B 블랙','HSM005C 크림']},
    'HS 솔리드': {pidx:1, models:['HS001W 화이트','HS002I 아이보리','HS003G 라이트그레이','HS004G 미디엄그레이','HS005B 블랙']},
    'HP 페인티드우드(저가)': {pidx:2, models:['HP101 화이트우드','HP102 아이보리우드','HP103 그레이우드','HP104 베이지우드']},
    'HP 페인티드우드(고가)': {pidx:3, models:['HP201 프리미엄화이트','HP202 프리미엄아이보리','HP203 프리미엄그레이']},
    'HE 텍스처/펄': {pidx:4, models:['HE101 실크화이트','HE102 실크아이보리','HE103 실크그레이','HE201 펄화이트','HE202 펄골드']},
    'HE407': {pidx:5, models:['HE407 스페셜']},
    'HC 솔리드항균': {pidx:6, models:['HC001W 항균화이트','HC002I 항균아이보리','HC003G 항균그레이']},
    'HL 우드항균': {pidx:7, models:['HL101 항균라이트우드','HL102 항균미디엄우드','HL103 항균다크우드']},
    'HW 우드얇': {pidx:8, models:['HW101 라이트오크','HW102 내추럴오크','HW103 다크오크','HW104 체리우드']},
    'HWB 우드굵': {pidx:9, models:['HWB101 와이드라이트','HWB102 와이드내추럴','HWB103 와이드다크']},
    'HPW 키친우드': {pidx:10, models:['HPW101 키친화이트','HPW102 키친우드','HPW103 키친그레이']},
    'HN 스톤': {pidx:11, models:['HN101 라이트스톤','HN102 미디엄스톤','HN103 다크스톤','HN104 그레이스톤']},
    'HM 마블': {pidx:12, models:['HM101 화이트마블','HM102 그레이마블','HM103 베이지마블','HM104 블랙마블']},
    'HT 메탈': {pidx:13, models:['HT101 실버','HT102 골드','HT103 브론즈','HT104 블랙메탈']},
    'HF 패브릭': {pidx:14, models:['HF101 라이트패브릭','HF102 미디엄패브릭','HF103 다크패브릭']},
    'HCP 세라믹': {pidx:15, models:['HCP101 화이트세라믹','HCP102 그레이세라믹','HCP103 베이지세라믹']},
    'HLC 콘크리트': {pidx:16, models:['HLC101 라이트콘크리트','HLC102 미디엄콘크리트','HLC103 다크콘크리트']},
    'HR 리얼우드': {pidx:17, models:['HR101 리얼오크','HR102 리얼체리','HR103 리얼월넛']},
    'HU 리얼터치우드': {pidx:18, models:['HU101 터치오크','HU102 터치월넛','HU103 터치체리']},
    'HI PP SOLID': {pidx:19, models:['HI101 PP화이트','HI102 PP아이보리','HI103 PP그레이']},
    'HO PP WOOD': {pidx:20, models:['HO101 PP우드라이트','HO102 PP우드내추럴','HO103 PP우드다크']},
  };
  Object.assign(MODEL_DB, cats);
})();
const MODEL_KEYS = Object.keys(MODEL_DB);

// ===== 필름 견적 로직 =====
let items = [];
let cnt = 0;

function today(){ return new Date().toISOString().slice(0,10); }
document.getElementById('rdate').value = today();

function calc(qty, r, c){
  if(qty<=0) return {amt:0,rollM:0,cutM:0};
  const rollM = Math.floor(qty/ROLL_M)*ROLL_M;
  const cutM  = qty % ROLL_M;
  return { amt: rollM*r + cutM*c, rollM, cutM };
}

function addItem(){
  const id=cnt++;
  const firstKey=MODEL_KEYS[0];
  const db=MODEL_DB[firstKey];
  const p=PRODUCTS[db.pidx];
  items.push({id, catKey:firstKey, modelName:db.models[0], qty:5, r:p.roll, c:p.cut});
  renderAll();
}

function removeItem(id){ items=items.filter(x=>x.id!==id); renderAll(); }
function get(id){ return items.find(x=>x.id===id); }

function onCat(id, catKey){
  const it=get(id); it.catKey=catKey;
  const db=MODEL_DB[catKey]; const p=PRODUCTS[db.pidx];
  it.modelName=db.models[0]; it.r=p.roll; it.c=p.cut;
  renderAll();
}
function onModel(id, modelName){ get(id).modelName=modelName; renderAll(); }
function onQty(id,v){ get(id).qty=+v||0; renderAll(); }
function stepQty(id,d){ const it=get(id); it.qty=Math.max(0,it.qty+d); renderAll(); }
function setQty(id,v){ get(id).qty=v; renderAll(); }

function renderAll(){
  const wrap=document.getElementById('items-wrap');
  wrap.innerHTML=''; let total=0;
  items.forEach((it,idx)=>{ const{amt}=calc(it.qty,it.r,it.c); total+=amt; wrap.appendChild(buildEl(it,idx+1)); });
  document.getElementById('total-amt').textContent=total.toLocaleString()+' 원';
}

function buildEl(it, num){
  const {amt,rollM,cutM}=calc(it.qty,it.r,it.c);
  const db=MODEL_DB[it.catKey];
  const div=document.createElement('div');
  div.className='item-card';
  div.innerHTML=`
    <div class="item-row" onclick="toggleDetail(${it.id})">
      <div class="item-num">${num}</div>
      <div class="item-row-info">
        <div class="item-row-name">${it.catKey}</div>
        <div class="item-row-sub">${it.modelName} · ${it.qty}m</div>
      </div>
      <div class="item-row-amt${amt===0?' zero':''}">${amt.toLocaleString()}원</div>
      <div class="item-expand-btn" id="exp-${it.id}">▼</div>
    </div>
    <div class="item-detail hidden" id="det-${it.id}">
      <div class="item-body">
        <div class="sel-group">
          <div class="sel-block cat">
            <label>대분류</label>
            <select onchange="onCat(${it.id},this.value)">
              ${MODEL_KEYS.map(k=>`<option value="${k}"${k===it.catKey?' selected':''}>${k}</option>`).join('')}
            </select>
          </div>
          <div class="sel-block model">
            <label>품명</label>
            <select onchange="onModel(${it.id},this.value)">
              ${db.models.map(m=>`<option value="${m}"${m===it.modelName?' selected':''}>${m}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="price-row">
          <div class="price-box roll">
            <div class="price-tag">롤 단가 / m</div>
            <div class="price-val">${it.r.toLocaleString()}</div>
            <div class="price-unit-txt">원 / 1m</div>
            <div class="price-locked">25m 단위</div>
          </div>
          <div class="price-box cut">
            <div class="price-tag">절단 단가 / m</div>
            <div class="price-val">${it.c.toLocaleString()}</div>
            <div class="price-unit-txt">원 / 1m</div>
            <div class="price-locked">25m 미만</div>
          </div>
        </div>
        <div class="qty-box">
          <div class="qty-top">
            <span class="qty-label">수량</span>
            <div class="qty-stepper">
              <button class="qty-btn" onclick="stepQty(${it.id},-1)">−</button>
              <input class="qty-input" type="number" value="${it.qty}" min="0" onchange="onQty(${it.id},this.value)" onblur="onQty(${it.id},this.value)">

let currentClientTab = 'film';
function loadClients(type='film'){ try{ return JSON.parse(localStorage.getItem(`om_clients_${type}`)||'[]'); }catch(e){ return []; } }
function saveClient(type='film'){
  const val=document.getElementById('new-client').value.trim();
  if(!val) return;
  const clients=loadClients(type);
  if(!clients.includes(val)){ clients.unshift(val); localStorage.setItem(`om_clients_${type}`,JSON.stringify(clients)); }
  document.getElementById('new-client').value='';
  refreshClientUI();
}
function deleteClient(name,type='film'){
  const clients=loadClients(type).filter(c=>c!==name);
  localStorage.setItem(`om_clients_${type}`,JSON.stringify(clients));
  refreshClientUI();
}
function moveClient(name,type,dir){
  const clients=loadClients(type);
  const idx=clients.indexOf(name);
  if(idx<0) return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=clients.length) return;
  clients.splice(idx,1); clients.splice(newIdx,0,name);
  localStorage.setItem(`om_clients_${type}`,JSON.stringify(clients));
  refreshClientUI();
}
function switchClientTab(type){
  currentClientTab=type;
  const fb=document.getElementById('tab-film');
  const db=document.getElementById('tab-door');
  if(fb){ fb.style.borderBottomColor=type==='film'?'var(--pk-red)':'transparent'; fb.style.color=type==='film'?'var(--pk-red)':'var(--gray-500)'; fb.style.fontWeight=type==='film'?'700':'600'; }

function showStats(){
  const sales = loadSales();
  const area = document.getElementById('stats-area');

  if(sales.length === 0){
    area.innerHTML = '<div class="stats-empty">📭 아직 확정된 견적이 없어요<br><br>견적서 보기 → 견적 확정 버튼을 누르면<br>데이터가 쌓여요!</div>';
    document.getElementById('stats-ovl').classList.add('show');
    return;
  }

  // 집계
  const totalAmt = sales.reduce((s,x)=>s+x.amt,0);
  const totalQty = sales.reduce((s,x)=>s+x.qty,0);

  // 제품별
  const byProduct = {};
  sales.forEach(x=>{
    if(!byProduct[x.product]) byProduct[x.product]={qty:0,amt:0};
    byProduct[x.product].qty += x.qty;
    byProduct[x.product].amt += x.amt;
  });
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].amt-a[1].amt).slice(0,10);
  const maxAmt = topProducts[0]?.[1]?.amt || 1;

  // 거래처별
  const byClient = {};
  sales.forEach(x=>{
    if(!byClient[x.client]) byClient[x.client]={qty:0,amt:0,cnt:0};
    byClient[x.client].qty += x.qty;
    byClient[x.client].amt += x.amt;
    byClient[x.client].cnt++;
  });
  const topClients = Object.entries(byClient).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8);

  // 월별
  const byMonth = {};
  sales.forEach(x=>{
    if(!byMonth[x.month]) byMonth[x.month]={amt:0,qty:0};
    byMonth[x.month].amt += x.amt;
    byMonth[x.month].qty += x.qty;
  });
  const months = Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const maxMonthAmt = Math.max(...months.map(m=>m[1].amt)) || 1;

  area.innerHTML = `
    <div class="stat-summary">
      <div class="summary-box"><div class="s-lbl">총 매출액</div><div class="s-val">${(totalAmt/10000).toFixed(0)}만원</div></div>
      <div class="summary-box green"><div class="s-lbl">총 판매량</div><div class="s-val">${totalQty}m</div></div>
    </div>

    <div class="stats-section">
      <h4>🏆 제품별 판매 순위</h4>
      ${topProducts.map(([name,d],i)=>`
        <div class="stat-card">
          <div class="stat-row">
            <span style="font-size:13px;font-weight:700;color:var(--gray-500);min-width:20px">${i+1}</span>
            <span class="stat-name">${name}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.round(d.amt/maxAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="stats-section">
      <h4>🏢 거래처별 매출</h4>
      <div class="stat-card">
        ${topClients.map(([name,d])=>`
          <div class="stat-client-row">
            <span style="font-weight:600">${name}</span>
            <span style="color:var(--gray-500);font-size:12px">${d.cnt}건 · ${d.qty}m</span>
            <span style="font-weight:700;color:var(--blue)">${d.amt.toLocaleString()}원</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="stats-section">
      <h4>📅 월별 매출</h4>
      ${months.map(([month,d])=>`
        <div class="stat-card">
          <div class="stat-row">
            <span class="stat-name">${month}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar orange" style="width:${Math.round(d.amt/maxMonthAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <button class="reset-stats-btn" onclick="resetStats()">🗑 데이터 전체 삭제</button>
  `;

  document.getElementById('stats-ovl').classList.add('show');
  document.getElementById('stats-ovl').scrollTop = 0;
}

function exportStats(){
  const sales = loadSales();
  if(sales.length === 0){ alert('데이터가 없어요.'); return; }
  const header = '날짜,월,거래처,제품명,그룹,수량(m),금액,롤(m),절단(m)';
  const rows = sales.map(x=>`${x.date},${x.month},${x.client},${x.product},${x.group},${x.qty},${x.amt},${x.rollM},${x.cutM}`);
  const csv = '\uFEFF' + [header, ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `오션메이드_판매데이터_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// 원판 사이즈 (SketchCut 기준 1220×2440)
const SHEET_W = 2440; // 세로(길이) — 절대 보존
const SHEET_H = 1220; // 가로(폭) — 컬럼 배치 방향
const KERF = 4;       // 칼날 두께 4mm (SketchCut 기본값)

// 등급 계산: 원판 기준
function getDoorGrade(w, h) {
  const maxSide = Math.max(w, h);
  if (maxSide <= 2100) return 1;
  if (maxSide <= 2300) return 2;
  return 3;
}


// ===== 가로 절단 알고리즘 (By Length - 수평 절단) =====
// ===== MAXRECTS 재단 배치도 =====
// 소요량: 컬럼 방식(길로틴 원칙), 배치도: MAXRECTS(정확한 시각화)

function normalizePiece(w, h) {
  return { rowL: Math.max(w,h), rowH: Math.min(w,h) };
}

function buildColumns(pieces) {
  const sorted = [...pieces].sort((a,b) => b.rowL - a.rowL || b.rowH - a.rowH);
  const columns = [];
  for(const p of sorted) {
    let bestCol = null, bestWaste = Infinity;
    for(const col of columns) {
      if(p.rowH <= col.colW && col.usedY + p.rowL <= 2440) {
        const waste = col.colW - p.rowH;
        if(waste < bestWaste) { bestWaste = waste; bestCol = col; }
      }
    }
    if(bestCol) { bestCol.items.push(p); bestCol.usedY += p.rowL + KERF; }
    else columns.push({ colW: p.rowH, usedY: p.rowL + KERF, items: [p] });
  }
  return columns;
}

function maxRectsPack(pieces) {
  const sheets = [];

  function splitFree(free, px, py, pw, ph) {
    const result = [];
    for(const f of free) {
      const ox = px < f.x+f.w && px+pw > f.x && py < f.y+f.h && py+ph > f.y;
      if(!ox) { result.push(f); continue; }
      if(f.x < px)           result.push({x:f.x,      y:f.y, w:px-f.x,              h:f.h});
      if(f.x+f.w > px+pw+KERF) result.push({x:px+pw+KERF, y:f.y, w:f.x+f.w-(px+pw+KERF), h:f.h});
      if(f.y < py)           result.push({x:f.x, y:f.y,      w:f.w, h:py-f.y});
      if(f.y+f.h > py+ph+KERF) result.push({x:f.x, y:py+ph+KERF, w:f.w, h:f.y+f.h-(py+ph+KERF)});
    }
    return result.filter((a,i) => a.w>0 && a.h>0 && !result.some((b,j) =>
      i!==j && b.x<=a.x && b.y<=a.y && b.x+b.w>=a.x+a.w && b.y+b.h>=a.y+a.h
    ));
  }

  const pcs = [...pieces].sort((a,b) => b.rowL*b.rowH - a.rowL*a.rowH);

  for(const p of pcs) {
    let bestScore=Infinity, bestSh=null, bestF=null, bestW=p.rowH, bestH=p.rowL;
    for(const sh of sheets) {
      for(const f of sh.free) {
        if(p.rowH<=f.w && p.rowL<=f.h) {
          const sc=Math.min(f.w-p.rowH, f.h-p.rowL);
          if(sc<bestScore){bestScore=sc;bestSh=sh;bestF=f;bestW=p.rowH;bestH=p.rowL;}
        }
        if(p.rowL<=f.w && p.rowH<=f.h) {
          const sc=Math.min(f.w-p.rowL, f.h-p.rowH);
          if(sc<bestScore){bestScore=sc;bestSh=sh;bestF=f;bestW=p.rowL;bestH=p.rowH;}
        }
      }
    }
    if(bestSh && bestF) {
      bestSh.pieces.push({x:bestF.x,y:bestF.y,w:bestW,h:bestH,origW:p.origW,origH:p.origH,name:p.name});
      bestSh.free = splitFree(bestSh.free, bestF.x, bestF.y, bestW, bestH);
    } else {
      const sh = {pieces:[],free:[{x:0,y:0,w:1220,h:2440}]};
      sheets.push(sh);
      sh.pieces.push({x:0,y:0,w:p.rowH,h:p.rowL,origW:p.origW,origH:p.origH,name:p.name});
      sh.free = splitFree(sh.free, 0, 0, p.rowH, p.rowL);
    }
  }
  return sheets;
}

function optimizeCuts(doors) {
  const pieces = [];
  doors.forEach(d => {
    for(let i=0;i<d.qty;i++) {
      const {rowL,rowH} = normalizePiece(d.w,d.h);
      pieces.push({rowL,rowH,origW:d.w,origH:d.h,name:d.name});
    }
  });

  const sheets = maxRectsPack(pieces);

  // 효율 내림차순 정렬
  sheets.sort((a,b) => b.pieces.reduce((s,p)=>s+p.w*p.h,0) - a.pieces.reduce((s,p)=>s+p.w*p.h,0));

  // usedX 계산 (소요량용)
  sheets.forEach(sh => {
    sh.usedX = sh.pieces.length>0 ? Math.max(...sh.pieces.map(p=>p.x+p.w)) : 0;
  });

  return sheets;
}

function calcSheetDecimal(pieces) {
  if(!pieces || pieces.length === 0) return 0;

  const pcs = pieces.map(p => ({
    rowL: Math.max(p.w, p.h),
    rowH: Math.min(p.w, p.h)
  }));

  // buildColumns와 동일한 로직
  const sorted = [...pcs].sort((a,b) => b.rowL - a.rowL || b.rowH - a.rowH);
  const columns = [];
  for(const p of sorted) {
    let placed = false;
    for(const col of columns) {
      if(p.rowH <= col.colW && col.usedY + p.rowL <= 2440) {
        col.usedY += p.rowL + KERF;
        placed = true;
        break;
      }
    }
    if(!placed) columns.push({ colW: p.rowH, usedY: p.rowL + KERF });
  }

  // BFD로 원판에 컬럼 배치
  const colsSorted = [...columns].sort((a,b) => b.colW - a.colW);
  const sheets = [];
  for(const col of colsSorted) {
    let bestSh = null, bestWaste = Infinity;
    for(const sh of sheets) {
      const addX = sh.usedX > 0 ? KERF : 0;
      const remaining = 1220 - sh.usedX - addX - col.colW;
      if(remaining >= 0 && remaining < bestWaste) {
        bestWaste = remaining; bestSh = sh;
      }
    }
    if(bestSh) {
      bestSh.usedX = bestSh.usedX + (bestSh.usedX > 0 ? KERF : 0) + col.colW;
    } else {
      sheets.push({ usedX: col.colW });
    }
  }


  if(sheets.length === 0) return 0;
  // 원판을 usedX 내림차순 정렬 → 마지막 원판이 가장 작은 usedX
  sheets.sort((a,b) => b.usedX - a.usedX);
  const fullSheets = sheets.length - 1;
  const lastUsedX = sheets[sheets.length - 1].usedX;
  return fullSheets + Math.ceil(lastUsedX / 100) / 10;
}

let doorGroups = [];
let doorCnt = 0;
let doorGrade = 1;

function setDoorGrade(g){
  doorGrade = g;
  [1,2,3].forEach(n => {
    const btn = document.getElementById(`grade-btn-${n}`);
    if(!btn) return;
    if(n===g){ btn.style.background='var(--blue)'; btn.style.borderColor='var(--blue)'; btn.style.color='white'; }
    else { btn.style.background='white'; btn.style.borderColor='var(--border)'; btn.style.color='var(--gray-500)'; }
  });
  renderDoorGroups();
}

function getUnitPrice(key){
  const [name, type] = key.split('|');
  const price = DOOR_PRICES.find(p=>p.name===name && p.type===type)
             || DOOR_PRICES.find(p=>p.name===name);
  return price ? price[`g${doorGrade}`] : 0;
}

function addDoorGroup() {
  const key = DOOR_PRICES[0].name + '|' + DOOR_PRICES[0].type;
  doorGroups.push({ key, open: true, items: [{ id: doorCnt++, w: 900, h: 2100, qty: 1 }] });
  renderDoorGroups();
}

function removeDoorGroup(gi) {
  doorGroups.splice(gi, 1);
  renderDoorGroups();
  updateDoorTotals();
}

function toggleDoorGroup(gi) {
  doorGroups[gi].open = !doorGroups[gi].open;
  renderDoorGroups();
}

function updateDoorGroup(gi, field, val) {
  if(field === 'key') doorGroups[gi].key = val;
  renderDoorGroups();
  updateDoorTotals();
}

function addDoorRow(gi) {
  doorGroups[gi].items.push({ id: doorCnt++, w: 0, h: 0, qty: 1 });
  renderDoorGroups();
  setTimeout(() => {
    const rows = document.querySelectorAll(`.drow-w-${gi}`);
    if(rows.length) {
      const last = rows[rows.length - 1];
      last.focus();
      last.select();
    }
  }, 30);
}

function removeDoorRow(gi, id) {
  doorGroups[gi].items = doorGroups[gi].items.filter(x => x.id !== id);
  if(doorGroups[gi].items.length === 0) doorGroups.splice(gi, 1);
  renderDoorGroups();
  updateDoorTotals();
}

function updateDoorRow(gi, id, field, val) {
  const item = doorGroups[gi].items.find(x => x.id === id);
  if(item) item[field] = parseInt(val) || 0;
  updateDoorTotals();
}

  const flat = [];
  doorGroups.forEach(g => {
    g.items.forEach(it => {
      flat.push({ id: it.id, key: g.key, w: it.w, h: it.h, qty: it.qty });
    });

  return flat;
}

    return;

  wrap.innerHTML = doorGroups.map((g, gi) => {
    const [colorName, colorType] = g.key.split('|');

    // 그룹 소계 계산
    const pieces = [];
    g.items.forEach(it => { for(let i=0;i<it.qty;i++) pieces.push({w:it.w, h:it.h}); });
    const sheets = pieces.length > 0 ? calcSheetDecimal(pieces) : 0;
    const unit = getUnitPrice(g.key);
    const groupAmt = Math.round(sheets * unit);

    const rows = g.open ? `
      <div style="padding:10px 12px;background:#FAFAF8;border-top:1px solid var(--border)">

const _origUpdateDoorTotals = updateDoorTotals;
function updateDoorTotals() {
  const flat = getFlatDoorItems();
  const groups = {};
  flat.forEach(it => {
    if(!groups[it.key]) groups[it.key] = [];
    for(let i=0; i<it.qty; i++) groups[it.key].push({w:it.w, h:it.h});
  });
  let total = 0;
  Object.entries(groups).forEach(([key, pieces]) => {
    if(pieces.length === 0) return;
    const sd = calcSheetDecimal(pieces);
    const unit = getUnitPrice(key);
    total += Math.round(sd * unit);
  });
  const el = document.getElementById('door-total');
  if(el) el.textContent = total.toLocaleString() + ' 원';
}

let lastSheets = [];

function drawCutLayout(sheets) {
  const ovl = document.getElementById('cut-layout-ovl');
  const container = document.getElementById('cut-layout-container');
  if(!ovl || !container) return;

  const COLORS = ['#B8D4E8','#F5D5B0','#C8E6C8','#F5C5D0','#D8D0F0','#F0E8C0','#C8E0E8','#E8D0C8','#D0E8D0','#E8E0D0'];
  const keyColorMap = {};
  let colorIdx = 0;
  getFlatDoorItems().forEach(it => {
    if(!keyColorMap[it.key]) keyColorMap[it.key] = COLORS[colorIdx++ % COLORS.length];
  });

  // SVG: x방향=폭(1220), y방향=길이(2440) → 세로로 세운 원판
  const SVG_W = 160;                              // 1220mm → 160px
  const SVG_H = Math.round(SVG_W * 2440 / 1220); // 160 * 2 = 320px
  const scaleX = SVG_W / 1220;  // 1220 → 160px
  const scaleY = SVG_H / 2440;  // 2440 → 320px

  container.innerHTML = sheets.map((sheet, si) => {
    const usedArea = sheet.pieces.reduce((s,p) => s + p.w * p.h, 0);
    const eff = Math.round(usedArea / (1220 * 2440) * 100);

    // 절단선: y방향 가로 구분선 (각 컷 경계)
    const cutYSet = new Set();
    sheet.pieces.forEach(p => { if(p.y > 0) cutYSet.add(p.y); });
    const cutLines = [...cutYSet].map(y => {
      const sy = y * scaleY;
      return `<line x1="0" y1="${sy}" x2="${SVG_W}" y2="${sy}" stroke="#666" stroke-width="0.8" stroke-dasharray="2,2"/>`;
    }).join('');

    const rects = sheet.pieces.map(p => {
      const color = keyColorMap[p.name] || '#DDD';
      const px = p.x * scaleX;
      const py = p.y * scaleY;
      const pw = p.w * scaleX;
      const ph = p.h * scaleY;
      const label = `${p.origW}×${p.origH}`;
      const fs = Math.min(pw, ph) > 14 ? 7 : 5;
      return `
        <rect x="${px}" y="${py}" width="${pw}" height="${ph}"
          fill="${color}" stroke="#444" stroke-width="0.8" rx="1"/>
        <text x="${px+pw/2}" y="${py+ph/2}" text-anchor="middle" dominant-baseline="middle"
          font-size="${fs}" fill="#222" font-family="sans-serif" font-weight="600">${label}</text>`;
    }).join('');

    // 사용폭(x방향 최대값) 기준으로 사용/낭비 계산
    const maxX = sheet.pieces.reduce((m,p) => Math.max(m, p.x + p.w), 0);
    const usedXpx = maxX * scaleX;
    const wasteW = 1220 - maxX;  // x방향 미사용 폭

    return `<div style="margin-bottom:24px;display:inline-block;margin-right:16px;vertical-align:top">
      <div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:3px">
        원판 ${si+1}번 · 효율 ${eff}%
      </div>
      <div style="font-size:10px;color:var(--gray-500);margin-bottom:5px">
        사용 ${maxX}mm / 낭비 ${wasteW}mm
      </div>
      <div style="display:flex;align-items:flex-start;gap:4px">
        <svg width="${SVG_W}" height="${SVG_H}"
          style="border:1.5px solid #999;border-radius:4px;background:#F5F5F0;flex-shrink:0">
          ${rects}
          ${cutLines}
          ${wasteW > 0 ? `
            <rect x="${usedXpx}" y="0" width="${SVG_W - usedXpx}" height="${SVG_H}"
              fill="#E0E0D8" opacity="0.55"/>
            <line x1="${usedXpx}" y1="0" x2="${usedXpx}" y2="${SVG_H}"
              stroke="#CC3333" stroke-width="1.5" stroke-dasharray="4,3"/>` : ''}
          <rect x="0" y="0" width="${SVG_W}" height="${SVG_H}"
            fill="none" stroke="#888" stroke-width="1.5"/>
          <text x="2" y="${SVG_H - 3}" font-size="6" fill="#bbb" font-family="sans-serif">←1220→</text>
        </svg>
        <div style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;color:#aaa;align-self:center;white-space:nowrap">
          2440mm
        </div>
      </div>
    </div>`;
  }).join('');

  // 가로 스크롤 가능한 래퍼로 감싸기
  container.innerHTML = `<div style="overflow-x:auto;white-space:nowrap;padding-bottom:8px">${container.innerHTML}</div>`;

  const legend = Object.entries(keyColorMap).map(([key, color]) => {
    const [name, type] = key.split('|');
    return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <div style="width:14px;height:14px;background:${color};border:1px solid #888;border-radius:2px;flex-shrink:0"></div>
      <span style="font-size:12px;color:var(--gray-700)">${name} <span style="color:#aaa;font-size:11px">(${type})</span></span>
    </div>`;
  }).join('');

  document.getElementById('cut-legend').innerHTML = legend;
  ovl.classList.add('show');
}


function calcDoorQuote() {
  const flat = getFlatDoorItems();
  if(flat.length===0){ alert('색상과 사이즈를 추가해주세요'); return; }
  const client = document.getElementById('door-client').value || '(거래처명)';
  const date = document.getElementById('door-date').value;

  // 색상별 그룹화
  const colorGroups = {};
  flat.forEach(it => {
    if(!colorGroups[it.key]) colorGroups[it.key] = [];
    for(let i=0; i<it.qty; i++) colorGroups[it.key].push({w:it.w, h:it.h, name:it.key});
  });

  // 배치도용 최적화
  lastSheets = optimizeCuts(
    Object.entries(colorGroups).flatMap(([key, pieces]) => {
      const unique = {};
      pieces.forEach(p => { const k=`${p.w}_${p.h}`; unique[k]=(unique[k]||0)+1; });
      return Object.entries(unique).map(([k,qty])=>{ const [w,h]=k.split('_'); return {w:+w,h:+h,qty,name:key}; });
    })
  );

  // 색상별 소요 원판 계산 (세로 스트립 방식)
  let rows = '';
  let total = 0;
  let totalSheetDecimal = 0;

  const colorSummary = Object.entries(colorGroups).map(([key, pieces]) => {
    const sheetDecimal = calcSheetDecimal(pieces);
    const unit = getUnitPrice(key);
    const amt = Math.round(sheetDecimal * unit);
    totalSheetDecimal += sheetDecimal;
    total += amt;
    const [colorName, colorType] = key.split('|');
    return {key, colorName, colorType, pieces, sheetDecimal, unit, amt};
  });

  colorSummary.forEach(({colorName, colorType, pieces, sheetDecimal, unit, amt}) => {
    rows += `<tr>
      <td>${colorName}<br><span style="font-size:11px;color:#888">${colorType}</span></td>
      <td style="text-align:center">${pieces.length}개 부재</td>
      <td style="text-align:center">${sheetDecimal}장</td>
      <td style="text-align:right">${unit.toLocaleString()}</td>
      <td style="text-align:right;font-weight:700">${amt.toLocaleString()}</td>
    </tr>`;
  });

  const totalSheetCount = lastSheets.length;
  const totalDecimalRounded = Math.ceil(totalSheetDecimal * 10) / 10;
  const totalPieceArea = flat.reduce((s,it)=>s+it.w*it.h*it.qty,0);
  const efficiency = Math.round(totalPieceArea / (totalSheetCount * SHEET_H * SHEET_W) * 100);

  document.getElementById('door-preview-area').innerHTML = `
    <div class="pv-wrap">
      <div class="pv-title">도 &nbsp; 어 &nbsp; 발 &nbsp; 주</div>
      <div class="pv-info">
        <div class="pv-row"><span class="pv-k">거래처</span><span class="pv-v bold">${client}</span></div>
        <div class="pv-row"><span class="pv-k">견적일</span><span class="pv-v">${date}</span></div>
        <div class="pv-row"><span class="pv-k">원판규격</span><span class="pv-v">2440×1220mm · SUPER 레이저도어</span></div>
      </div>

      <button onclick="drawCutLayout(lastSheets)"
        style="width:100%;padding:13px;background:linear-gradient(135deg,#1A4F8A,#2563a8);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
        <span>📐 재단 배치도 보기</span>
        <span style="font-size:18px;background:rgba(255,255,255,0.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center">▶</span>
      </button>

      <div class="pv-table-wrap">
        <table class="pv-table">
          <thead><tr><th>색상명</th><th>부재수</th><th>원판(장)</th><th>단가/장</th><th>금액</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td colspan="4">합 &nbsp; 계</td><td>${total.toLocaleString()}</td></tr></tfoot>
        </table>
      </div>

      <div class="pv-bank">
        <div class="pv-bank-notice">⚠ &nbsp; 선 입 금 후 발 주</div>
        <div class="pv-bank-body">
          <div class="pv-bank-num">332-135674-04-011</div>
          <div class="pv-bank-info">기업은행 &nbsp;|&nbsp; 예금주: 주식회사 오션메이드</div>
        </div>
      </div>
      <div style="font-size:10px;color:#aaa;text-align:center;padding:6px 0">※ 입금확인 후 제작 · SUPER 레이저도어 제로조인트 기준</div>
    </div>`;
  document.getElementById('door-preview-ovl').classList.add('show');
  document.getElementById('door-preview-ovl').scrollTop = 0;
}

<!-- 도어 견적서 미리보기 -->
<div class="ovl" id="door-preview-ovl">
  <div class="modal">
    <div class="modal-bar">
      <button class="close-btn" onclick="closeDoorPreview()" style="font-size:14px;font-weight:700;color:var(--blue);border-color:var(--blue-light);background:var(--blue-light)">‹ 뒤로</button>
      <h3>도어 발주 견적서</h3>
      <div style="width:60px"></div>
    </div>
    <div class="parea" id="door-preview-area"></div>
    <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:white;position:sticky;bottom:0">
      <button class="btn-print" style="flex:1" onclick="doDoorPrint()">🖨 인쇄/저장</button>
    </div>
  </div>
</div>

<!-- 재단 배치도 모달 -->
<div class="ovl" id="cut-layout-ovl">
  <div class="modal">
    <div class="modal-bar">
      <button class="close-btn" onclick="closeCutLayout()" style="font-size:14px;font-weight:700;color:var(--blue);border-color:var(--blue-light);background:var(--blue-light)">‹ 뒤로</button>
      <h3>📐 재단 배치도</h3>
      <div style="width:60px"></div>
    </div>
    <div style="padding:16px;overflow-y:auto;max-height:calc(100vh - 60px)">
      <div id="cut-legend" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding:12px;background:var(--gray-50);border-radius:10px"></div>
      <div id="cut-layout-container"></div>
    </div>
  </div>
</div>

</body>
</html>
