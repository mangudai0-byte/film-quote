<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오션메이드 필름 견적서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #1A4F8A;
  --blue-light: #EAF1FA;
  --blue-mid: #2E6BB5;
  --orange: #C05010;
  --orange-light: #FDF0E8;
  --green: #1A7A4A;
  --green-light: #E8F7EF;
  --gray-900: #1A1A1A;
  --gray-700: #3D3D3D;
  --gray-500: #6B6B6B;
  --gray-300: #BBBBBB;
  --gray-100: #F4F4F2;
  --gray-50: #FAFAF8;
  --white: #FFFFFF;
  --border: #E0DDD8;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans KR', sans-serif; background: #EDEAE5; color: var(--gray-900); min-height: 100vh; }

header {
  background: var(--blue);
  color: white;
  padding: 0 16px;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
header h1 { font-size: 15px; font-weight: 600; }
header span { font-size: 11px; opacity: 0.65; }

.container { max-width: 540px; margin: 0 auto; padding: 14px 12px 100px; }

.card {
  background: var(--white);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.card-header {
  background: var(--gray-50);
  border-bottom: 1px solid var(--border);
  padding: 11px 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-header .icon {
  width: 26px; height: 26px;
  background: var(--blue); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.card-header h2 { font-size: 13px; font-weight: 600; color: var(--gray-700); }
.card-body { padding: 14px 16px; }

/* FORM */
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label { font-size: 11px; color: var(--gray-500); font-weight: 500; display: block; margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 11px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; font-family: inherit;
  background: var(--white); color: var(--gray-900);
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(46,107,181,0.12); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* ITEM CARD */
.item-card {
  background: var(--gray-50);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.item-head {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
  display: flex; align-items: center; gap: 8px;
}
.item-num {
  width: 22px; height: 22px;
  background: var(--blue); color: white;
  border-radius: 50%; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.item-head select {
  flex: 1; padding: 7px 10px;
  border: 1px solid var(--border); border-radius: 7px;
  font-size: 13px; font-family: inherit;
  background: white; color: var(--gray-900);
  -webkit-appearance: none; appearance: none;
}
.del-btn {
  width: 32px; height: 32px;
  background: none; border: 1px solid var(--border);
  border-radius: 7px; font-size: 18px; color: var(--gray-500);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.del-btn:active { background: #FEE; color: #C33; }

.item-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* COLOR INPUT */
.color-field label { font-size: 11px; color: var(--gray-500); font-weight: 500; display: block; margin-bottom: 5px; }
.color-field input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; font-family: inherit; background: white; color: var(--gray-900);
}
.color-field input:focus { outline: none; border-color: var(--blue-mid); }

/* PRICE BOXES - 핵심 */
.price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.price-box {
  border-radius: 10px; padding: 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.price-box.roll { background: var(--blue-light); border: 1.5px solid #B8CDE8; }
.price-box.cut  { background: var(--orange-light); border: 1.5px solid #E8C4A0; }
.price-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
.price-box.roll .price-tag { color: var(--blue); }
.price-box.cut  .price-tag { color: var(--orange); }
.price-val { font-size: 20px; font-weight: 700; line-height: 1; }
.price-box.roll .price-val { color: var(--blue); }
.price-box.cut  .price-val { color: var(--orange); }
.price-unit-txt { font-size: 11px; font-weight: 400; }
.price-locked {
  display: block; font-size: 12px; color: rgba(0,0,0,0.35);
  text-align: right; margin-top: 2px;
}
.price-locked::before { content: '🔒 '; font-size: 10px; }

/* QTY */
.qty-box {
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
}
.qty-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.qty-label { font-size: 13px; font-weight: 600; color: var(--gray-700); }
.qty-stepper { display: flex; align-items: center; margin-left: auto; }
.qty-btn {
  width: 38px; height: 38px;
  border: 1px solid var(--border); background: var(--gray-50);
  font-size: 20px; color: var(--gray-700);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.qty-btn:first-child { border-radius: 8px 0 0 8px; }
.qty-btn:last-child  { border-radius: 0 8px 8px 0; }
.qty-btn:active { background: var(--blue-light); color: var(--blue); }
.qty-input {
  width: 56px; height: 38px;
  border: 1px solid var(--border); border-left: none; border-right: none;
  text-align: center; font-size: 16px; font-weight: 700;
  font-family: inherit; color: var(--gray-900); background: white;
}
.qty-input:focus { outline: none; background: var(--blue-light); }
.qty-unit { font-size: 13px; color: var(--gray-500); margin-left: 6px; }
.qty-shorts { display: flex; gap: 6px; flex-wrap: wrap; }
.qty-short {
  padding: 6px 10px; font-size: 12px; font-family: inherit;
  border: 1px solid var(--border); border-radius: 6px;
  background: white; color: var(--gray-700); cursor: pointer;
}
.qty-short:active { background: var(--blue); color: white; border-color: var(--blue); }

/* BREAKDOWN */
.breakdown {
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 12px;
}
.bd-title { font-size: 11px; color: var(--gray-500); font-weight: 500; margin-bottom: 8px; }
.bd-chips { display: flex; flex-direction: column; gap: 6px; }
.bd-chip {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 7px; font-size: 13px;
}
.bd-chip.roll-chip { background: var(--blue-light); }
.bd-chip.cut-chip  { background: var(--orange-light); }
.bd-chip .chip-left { display: flex; align-items: center; gap: 6px; }
.bd-chip .chip-tag {
  font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
}
.roll-chip .chip-tag { background: var(--blue); color: white; }
.cut-chip  .chip-tag { background: var(--orange); color: white; }
.bd-chip .chip-desc { font-size: 12px; color: var(--gray-700); }
.bd-chip .chip-amt { font-size: 14px; font-weight: 700; }
.roll-chip .chip-amt { color: var(--blue); }
.cut-chip  .chip-amt { color: var(--orange); }
.bd-total {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: baseline;
}
.bd-total .lbl { font-size: 12px; color: var(--gray-500); }
.bd-total .val { font-size: 20px; font-weight: 700; color: var(--gray-900); }

/* ADD BTN */
.add-btn {
  width: 100%; padding: 14px;
  border: 2px dashed var(--border); border-radius: var(--radius);
  background: none; font-size: 14px; font-family: inherit;
  color: var(--gray-500); cursor: pointer;
}
.add-btn:active { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }

/* TOTAL BAR */
.total-bar {
  background: var(--blue); border-radius: var(--radius);
  padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; color: white;
}
.total-bar .lbl { font-size: 14px; opacity: 0.8; }
.total-bar .amt { font-size: 26px; font-weight: 700; }

/* BUTTONS */
.actions { display: flex; gap: 8px; }
.btn-reset {
  padding: 14px 20px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: white; font-size: 14px; font-family: inherit; color: var(--gray-700); cursor: pointer;
}
.btn-preview {
  flex: 1; padding: 14px;
  background: var(--blue); color: white; border: none;
  border-radius: var(--radius); font-size: 15px; font-weight: 600;
  font-family: inherit; cursor: pointer;
}
.btn-preview:active { background: #163F6E; }

/* ===== PASSWORD SCREEN ===== */
.pw-screen {
  position: fixed; inset: 0; z-index: 999;
  background: var(--blue);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.pw-screen.hidden { display: none; }
.pw-box {
  background: white; border-radius: 16px;
  padding: 32px 28px; width: 100%; max-width: 340px;
  text-align: center;
}
.pw-logo { font-size: 40px; margin-bottom: 12px; }
.pw-title { font-size: 18px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
.pw-sub { font-size: 13px; color: var(--gray-500); margin-bottom: 24px; }
.pw-input {
  width: 100%; padding: 14px 16px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 20px; font-family: inherit; letter-spacing: 6px;
  text-align: center; color: var(--gray-900);
  margin-bottom: 12px;
}
.pw-input:focus { outline: none; border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(46,107,181,0.12); }
.pw-btn {
  width: 100%; padding: 14px;
  background: var(--blue); color: white; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 600;
  font-family: inherit; cursor: pointer;
}
.pw-btn:active { background: #163F6E; }
.pw-error { font-size: 13px; color: #C03030; margin-top: 10px; display: none; }
.pw-error.show { display: block; }

/* ===== MODAL / PREVIEW ===== */
.ovl {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 200;
  overflow-y: auto;
}
.ovl.show { display: block; }
.modal {
  background: white; margin: 0;
  min-height: 100vh;
}
.modal-bar {
  position: sticky; top: 0; z-index: 10;
  background: white; border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-bar h3 { font-size: 15px; font-weight: 600; }
.modal-actions { display: flex; gap: 8px; }
.btn-confirm {
  padding: 8px 16px;
  background: #1A7A4A; color: white; border: none;
  border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.btn-print {
  padding: 8px 16px;
  background: var(--blue); color: white; border: none;
  border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.close-btn {
  width: 36px; height: 36px;
  background: none; border: 1px solid var(--border);
  border-radius: 7px; font-size: 22px; color: var(--gray-500);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}

/* ===== PRINT / PREVIEW AREA ===== */
.parea { padding: 12px 12px; }

/* 모바일 견적서 카드형 */
.p-header {
  text-align: center; font-size: 18px; font-weight: 700;
  letter-spacing: 6px; margin-bottom: 10px; color: #111;
}
.p-info-box {
  border: 1.5px solid #333; border-radius: 0;
  margin-bottom: 8px; overflow: hidden;
}
.p-info-row {
  display: flex; border-bottom: 1px solid #ddd;
  font-size: 12px;
}
.p-info-row:last-child { border-bottom: none; }
.p-info-key {
  width: 70px; min-width: 70px; padding: 6px 8px;
  background: #f5f5f5; color: #555; font-size: 11px;
  border-right: 1px solid #ddd; font-weight: 500;
}
.p-info-val { padding: 6px 8px; color: #222; flex: 1; word-break: break-all; }

.p-supplier {
  border: 1.5px solid #333; border-radius: 0;
  margin-bottom: 8px; overflow: hidden;
}
.p-supplier-title {
  background: #f0f0f0; text-align: center;
  padding: 5px; font-size: 12px; font-weight: 700;
  border-bottom: 1px solid #ddd;
}

.p-note { font-size: 10px; color: #666; margin-bottom: 8px; line-height: 1.5; }

/* 품목 카드형 */
.p-item {
  border: 1.5px solid #ccc; border-radius: 6px;
  margin-bottom: 6px; overflow: hidden;
}
.p-item-name {
  background: #f5f5f5; padding: 7px 10px;
  font-size: 13px; font-weight: 700; color: #111;
  border-bottom: 1px solid #ddd;
}
.p-item-rows { padding: 0; }
.p-item-row {
  display: flex; align-items: center;
  padding: 6px 10px; border-bottom: 1px solid #eee;
  font-size: 12px;
}
.p-item-row:last-child { border-bottom: none; }
.p-item-row .k { color: #666; min-width: 50px; font-size: 11px; }
.p-item-row .v { font-weight: 600; color: #111; margin-left: auto; }
.p-item-row .tag-r {
  font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
  background: #EAF1FA; color: #1A4F8A; margin-right: 4px;
}
.p-item-row .tag-c {
  font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
  background: #FDF0E8; color: #C05010; margin-right: 4px;
}
.p-item-subtotal {
  background: #f9f9f9; padding: 6px 10px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid #ddd;
}
.p-item-subtotal .sl { font-size: 11px; color: #888; }
.p-item-subtotal .sv { font-size: 14px; font-weight: 700; color: #1A4F8A; }

.p-total {
  background: #1A4F8A; color: white;
  border-radius: 7px; padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center;
  margin: 8px 0 8px;
}
.p-total .tl { font-size: 13px; opacity: 0.85; }
.p-total .tv { font-size: 20px; font-weight: 700; }

.p-bank {
  border: 2px solid #1A4F8A;
  border-radius: 8px; margin-bottom: 8px;
  overflow: hidden;
}
.p-bank-notice {
  background: #D05010; color: white;
  text-align: center; padding: 7px;
  font-size: 14px; font-weight: 700; letter-spacing: 2px;
}
.p-bank-label {
  font-size: 10px; color: #666; font-weight: 500;
  padding: 7px 12px 1px;
}
.p-bank-num {
  font-size: 20px; font-weight: 700; color: #1A4F8A;
  padding: 0 12px 4px; letter-spacing: 1px;
}
.p-bank-info {
  font-size: 12px; color: #444;
  padding: 0 12px 8px;
}
.p-footnote { display: none; }

/* STATS */
.stats-section { margin-bottom: 20px; }
.stats-section h4 { font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.stat-card { background: var(--gray-50); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.stat-name { font-size: 13px; font-weight: 600; color: var(--gray-900); flex: 1; }
.stat-qty { font-size: 12px; color: var(--gray-500); min-width: 50px; text-align: right; }
.stat-amt { font-size: 14px; font-weight: 700; color: var(--blue); min-width: 90px; text-align: right; }
.stat-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; }
.stat-bar { height: 6px; background: var(--blue); border-radius: 3px; transition: width 0.3s; }
.stat-bar.orange { background: var(--orange); }
.stats-empty { text-align: center; padding: 40px; color: var(--gray-500); font-size: 14px; }
.stat-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.summary-box { background: var(--blue); color: white; border-radius: 10px; padding: 14px; text-align: center; }
.summary-box.green { background: #1A7A4A; }
.summary-box .s-lbl { font-size: 11px; opacity: 0.8; margin-bottom: 4px; }
.summary-box .s-val { font-size: 20px; font-weight: 700; }
.stat-client-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.stat-client-row:last-child { border-bottom: none; }
.reset-stats-btn { width: 100%; padding: 10px; border: 1px solid #F99; border-radius: 8px; background: none; color: #C33; font-size: 13px; font-family: inherit; cursor: pointer; margin-top: 8px; }

@media print {
  header, .modal-bar { display: none !important; }
  .ovl { position: static !important; background: none !important; }
  .modal { min-height: unset; }
  .parea { padding: 10px; }
}
</style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div class="pw-screen" id="pw-screen">
  <div class="pw-box">
    <div class="pw-logo">🎬</div>
    <div class="pw-title">오션메이드 견적서</div>
    <div class="pw-sub">비밀번호를 입력하세요</div>
    <input class="pw-input" id="pw-input" type="password" maxlength="20"
      onkeydown="if(event.key==='Enter') checkPw()">
    <button class="pw-btn" onclick="checkPw()">확인</button>
    <div class="pw-error" id="pw-error">비밀번호가 틀렸습니다</div>
  </div>
</div>

<header>
  <h1>🎬 오션메이드 필름 견적서</h1>
  <button onclick="showStats()" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:white;padding:6px 12px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer">📊 판매현황</button>
</header>

<div class="container">
  <!-- 거래처 -->
  <div class="card">
    <div class="card-header">
      <div class="icon">📋</div>
      <h2>거래처 정보</h2>
    </div>
    <div class="card-body">
      <div class="row2">
        <div class="field"><label>거래처명</label><input id="client" type="text"></div>
        <div class="field"><label>현장명 (선택)</label><input id="site" type="text"></div>
      </div>
      <div class="row2">
        <div class="field"><label>접수일</label><input id="rdate" type="date"></div>
        <div class="field"><label>출고일</label><input id="sdate" type="date"></div>
      </div>
      <div class="field"><label>출고방식</label>
        <select id="smethod">
          <option>직접출고</option><option>택배</option><option>방문수령</option><option>기타</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 품목 -->
  <div class="card">
    <div class="card-header">
      <div class="icon">🎞</div>
      <h2>품목</h2>
    </div>
    <div class="card-body">
      <div id="items-wrap"></div>
      <button class="add-btn" onclick="addItem()">＋ 품목 추가</button>
    </div>
  </div>

  <div class="total-bar">
    <span class="lbl">총 합계</span>
    <span class="amt" id="total-display">0 원</span>
  </div>

  <div class="actions">
    <button class="btn-reset" onclick="resetForm()">↺ 초기화</button>
    <button class="btn-preview" onclick="showPreview()">견적서 보기 →</button>
  </div>
</div>

<!-- 미리보기 모달 -->
<div class="ovl" id="ovl">
  <div class="modal">
    <div class="modal-bar">
      <h3>견적서</h3>
      <button class="close-btn" onclick="closePreview()">×</button>
    </div>
    <div class="parea" id="parea"></div>
    <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:white;position:sticky;bottom:0">
      <button class="btn-confirm" onclick="confirmQuote()" style="flex:1">✅ 견적 확정</button>
      <button class="btn-print" onclick="doPrint()" style="flex:1">🖨 인쇄/저장</button>
    </div>
  </div>
</div>

<!-- 판매현황 모달 -->
<div class="ovl" id="stats-ovl">
  <div class="modal">
    <div class="modal-bar">
      <h3>📊 판매현황</h3>
      <div class="modal-actions">
        <button class="btn-print" onclick="exportStats()" style="background:#1A7A4A">📥 내보내기</button>
        <button class="close-btn" onclick="closeStats()">×</button>
      </div>
    </div>
    <div class="parea" id="stats-area"></div>
  </div>
</div>

<script>
const ROLL_M = 25;
const PASSWORD = '8253';

function checkPw(){
  const val = document.getElementById('pw-input').value;
  if(val === PASSWORD){
    document.getElementById('pw-screen').classList.add('hidden');
    sessionStorage.setItem('auth','1');
  } else {
    const err = document.getElementById('pw-error');
    err.classList.add('show');
    document.getElementById('pw-input').value='';
    setTimeout(()=>err.classList.remove('show'), 2000);
  }
}
// 세션 유지
if(sessionStorage.getItem('auth')==='1'){
  document.getElementById('pw-screen').classList.add('hidden');
}
// 포커스
setTimeout(()=>{ const i=document.getElementById('pw-input'); if(i) i.focus(); }, 100);

const PRODUCTS = [
  {label:'HSM 슈퍼매트 (01-34)',          group:'솔리드',     roll:7600,  cut:10400},
  {label:'HA 슈퍼매트 (911)',              group:'솔리드',     roll:7600,  cut:10400},
  {label:'HS 솔리드 (001-053)',            group:'솔리드',     roll:5200,  cut:8000},
  {label:'HE 텍스처/펄 (401-406)',         group:'솔리드',     roll:5400,  cut:8400},
  {label:'HE 텍스처/펄 (407)',             group:'솔리드',     roll:7600,  cut:11800},
  {label:'HP 페인티드우드 (505-517)',       group:'솔리드',     roll:5200,  cut:8000},
  {label:'HP 페인티드우드 (501-504,518-540)',group:'솔리드',   roll:5400,  cut:8400},
  {label:'HW 우드 (얇은글씨)',             group:'우드',       roll:5400,  cut:8400},
  {label:'HWB 우드 (굵은글씨)',            group:'우드',       roll:5800,  cut:8900},
  {label:'HPW 키친우드 (20-24)',           group:'우드',       roll:5400,  cut:8400},
  {label:'HN 스톤 (2001-2013)',            group:'스톤',       roll:5800,  cut:8900},
  {label:'HM 마블 (2101-2104)',            group:'마블',       roll:5800,  cut:8900},
  {label:'HT 메탈 (2301-2309)',            group:'메탈',       roll:6000,  cut:9200},
  {label:'HF 패브릭 (2201-2210)',          group:'패브릭',     roll:5800,  cut:8900},
  {label:'HCP 세라믹 (01-04)',             group:'세라믹',     roll:5800,  cut:8900},
  {label:'HLC 콘크리트 (010-011)',         group:'콘크리트',   roll:5800,  cut:8900},
  {label:'HC 솔리드향균 (801-804)',        group:'향균',       roll:5200,  cut:8000},
  {label:'HLC 우드향균 (1851-1852)',       group:'향균',       roll:5400,  cut:8400},
  {label:'HR 리얼우드 (3001-3008)',        group:'프리미엄우드',roll:10900, cut:16900},
  {label:'HU 리얼터치우드 (3301-3304)',    group:'프리미엄우드',roll:12800, cut:19800},
  {label:'HI PP SOLID (4001,4002)',        group:'프리미엄우드',roll:14000, cut:21600},
  {label:'HO PP WOOD (4301-4303)',         group:'프리미엄우드',roll:14000, cut:21600},
];

let items = [];
let cnt = 0;

function today(){ return new Date().toISOString().slice(0,10); }
document.getElementById('rdate').value = today();
document.getElementById('sdate').value = today();

function calc(qty, r, c){
  if(qty<=0) return {amt:0,rollM:0,cutM:0};
  const rollM = Math.floor(qty/ROLL_M)*ROLL_M;
  const cutM  = qty % ROLL_M;
  return { amt: rollM*r + cutM*c, rollM, cutM };
}

function groupedOpts(){
  const g={};
  PRODUCTS.forEach((p,i)=>{ if(!g[p.group]) g[p.group]=[]; g[p.group].push({...p,i}); });
  return Object.entries(g).map(([grp,ps])=>
    `<optgroup label="── ${grp} ──">${ps.map(p=>`<option value="${p.i}">${p.label}</option>`).join('')}</optgroup>`
  ).join('');
}

function addItem(){
  const id=cnt++;
  items.push({id,pidx:0,color:'',qty:5,r:PRODUCTS[0].roll,c:PRODUCTS[0].cut});
  renderAll();
}
function removeItem(id){ items=items.filter(x=>x.id!==id); renderAll(); }
function get(id){ return items.find(x=>x.id===id); }

function onProd(id,val){
  const it=get(id); it.pidx=+val;
  const p=PRODUCTS[it.pidx]; it.r=p.roll; it.c=p.cut;
  renderAll();
}
function onColor(id,v){ get(id).color=v; }
function onQty(id,v){ get(id).qty=+v||0; renderAll(); }
function stepQty(id,d){ const it=get(id); it.qty=Math.max(0,it.qty+d); renderAll(); }
function setQty(id,v){ get(id).qty=v; renderAll(); }

function renderAll(){
  const wrap=document.getElementById('items-wrap');
  wrap.innerHTML='';
  let total=0;
  items.forEach((it,idx)=>{
    const {amt}=calc(it.qty,it.r,it.c);
    total+=amt;
    wrap.appendChild(buildEl(it,idx+1));
  });
  document.getElementById('total-display').textContent=total.toLocaleString()+' 원';
}

function buildEl(it,num){
  const p=PRODUCTS[it.pidx];
  const {amt,rollM,cutM}=calc(it.qty,it.r,it.c);
  const div=document.createElement('div');
  div.className='item-card';

  let chips='';
  if(it.qty>0){
    if(rollM>0&&cutM>0){
      chips=`
        <div class="bd-chip roll-chip">
          <div class="chip-left"><span class="chip-tag">롤</span><span class="chip-desc">${rollM}m × ${it.r.toLocaleString()}원</span></div>
          <span class="chip-amt">${(rollM*it.r).toLocaleString()}원</span>
        </div>
        <div class="bd-chip cut-chip">
          <div class="chip-left"><span class="chip-tag">절단</span><span class="chip-desc">${cutM}m × ${it.c.toLocaleString()}원</span></div>
          <span class="chip-amt">${(cutM*it.c).toLocaleString()}원</span>
        </div>`;
    } else if(rollM>0){
      chips=`<div class="bd-chip roll-chip">
        <div class="chip-left"><span class="chip-tag">롤</span><span class="chip-desc">${rollM}m × ${it.r.toLocaleString()}원</span></div>
        <span class="chip-amt">${amt.toLocaleString()}원</span>
      </div>`;
    } else {
      chips=`<div class="bd-chip cut-chip">
        <div class="chip-left"><span class="chip-tag">절단</span><span class="chip-desc">${cutM}m × ${it.c.toLocaleString()}원</span></div>
        <span class="chip-amt">${amt.toLocaleString()}원</span>
      </div>`;
    }
  }

  div.innerHTML=`
    <div class="item-head">
      <div class="item-num">${num}</div>
      <select onchange="onProd(${it.id},this.value)">${groupedOpts()}</select>
      <button class="del-btn" onclick="removeItem(${it.id})">×</button>
    </div>
    <div class="item-body">
      <div class="color-field">
        <label>색상명 직접입력</label>
        <input type="text" value="${it.color}" oninput="onColor(${it.id},this.value)">
      </div>
      <div class="price-row">
        <div class="price-box roll">
          <div class="price-tag">롤 단가 (25m↑)</div>
          <div class="price-val">${it.r.toLocaleString()}<span class="price-unit-txt">원/m</span></div>
          <div class="price-edit"><span class="price-locked">${it.r.toLocaleString()}</span></div>
        </div>
        <div class="price-box cut">
          <div class="price-tag">절단 단가 (25m↓)</div>
          <div class="price-val">${it.c.toLocaleString()}<span class="price-unit-txt">원/m</span></div>
          <div class="price-edit"><span class="price-locked">${it.c.toLocaleString()}</span></div>
        </div>
      </div>
      <div class="qty-box">
        <div class="qty-top">
          <span class="qty-label">수 량</span>
          <div class="qty-stepper">
            <button class="qty-btn" onclick="stepQty(${it.id},-5)">−</button>
            <input class="qty-input" type="number" value="${it.qty}" oninput="onQty(${it.id},this.value)">
            <button class="qty-btn" onclick="stepQty(${it.id},5)">＋</button>
          </div>
          <span class="qty-unit">m</span>
        </div>
        <div class="qty-shorts">
          ${[5,10,15,20,25,30,40,50,75,100].map(q=>`<button class="qty-short" onclick="setQty(${it.id},${q})">${q}m</button>`).join('')}
        </div>
      </div>
      <div class="breakdown">
        <div class="bd-title">계산 내역</div>
        <div class="bd-chips">${chips}</div>
        <div class="bd-total"><span class="lbl">소계</span><span class="val">${amt.toLocaleString()} 원</span></div>
      </div>
    </div>`;

  div.querySelector('select').value=it.pidx;
  return div;
}

function resetForm(){
  if(items.length>0&&!confirm('초기화할까요?')) return;
  document.getElementById('client').value='';
  document.getElementById('site').value='';
  document.getElementById('rdate').value=today();
  document.getElementById('sdate').value=today();
  document.getElementById('smethod').value='직접출고';
  items=[]; cnt=0; renderAll();
}

      <div class="p-info-row"><div class="p-info-key">출고일</div><div class="p-info-val">${sd}</div></div>

    <div class="p-total"><span class="tl">총 합계</span><span class="tv">${total.toLocaleString()} 원</span></div>
    <div class="p-bank">
      <div class="p-bank-notice">⚠️ 선입금 후 발주</div>
      <div class="p-bank-label">입금계좌</div>
      <div class="p-bank-num">332-135674-04-011</div>

        <div class="p-info-row"><div class="p-info-key">주소</div><div class="p-info-val">충남 아산시 신창면 환경공원로 213-9</div></div>

// ===== 판매 데이터 =====
function loadSales(){ try{ return JSON.parse(localStorage.getItem('om_sales')||'[]'); }catch(e){ return []; } }
function saveSales(data){ localStorage.setItem('om_sales', JSON.stringify(data)); }

function confirmQuote(){
  const client = document.getElementById('client').value || '(거래처명)';
  const rd = document.getElementById('rdate').value;
  if(items.length === 0){ alert('품목을 추가해주세요.'); return; }

  const sales = loadSales();
  const month = rd.slice(0, 7); // YYYY-MM
  items.forEach(it => {
    const p = PRODUCTS[it.pidx];
    const {amt, rollM, cutM} = calc(it.qty, it.r, it.c);
    sales.push({
      date: rd,
      month,
      client,
      product: it.color || p.label,
      group: p.group,
      qty: it.qty,
      amt,
      rollM,
      cutM
    });
  });
  saveSales(sales);

  // 확정 표시
  const btn = document.querySelector('.btn-confirm');
  btn.textContent = '✅ 저장완료!';
  btn.style.background = '#888';
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = '✅ 견적 확정';
    btn.style.background = '#1A7A4A';
    btn.disabled = false;
  }, 2000);
}

function showStats(){
  const sales = loadSales();
  const area = document.getElementById('stats-area');

  if(sales.length === 0){
    area.innerHTML = '<div class="stats-empty">📭 아직 확정된 견적이 없어요<br><br>견적서 보기 → 견적 확정 버튼을 누르면<br>데이터가 쌓여요!</div>';
    document.getElementById('stats-ovl').classList.add('show');
    return;
  }

  // 집계
  const totalAmt = sales.reduce((s,x)=>s+x.amt,0);
  const totalQty = sales.reduce((s,x)=>s+x.qty,0);

  // 제품별
  const byProduct = {};
  sales.forEach(x=>{
    if(!byProduct[x.product]) byProduct[x.product]={qty:0,amt:0};
    byProduct[x.product].qty += x.qty;
    byProduct[x.product].amt += x.amt;
  });
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].amt-a[1].amt).slice(0,10);
  const maxAmt = topProducts[0]?.[1]?.amt || 1;

  // 거래처별
  const byClient = {};
  sales.forEach(x=>{
    if(!byClient[x.client]) byClient[x.client]={qty:0,amt:0,cnt:0};
    byClient[x.client].qty += x.qty;
    byClient[x.client].amt += x.amt;
    byClient[x.client].cnt++;
  });
  const topClients = Object.entries(byClient).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8);

  // 월별
  const byMonth = {};
  sales.forEach(x=>{
    if(!byMonth[x.month]) byMonth[x.month]={amt:0,qty:0};
    byMonth[x.month].amt += x.amt;
    byMonth[x.month].qty += x.qty;
  });
  const months = Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const maxMonthAmt = Math.max(...months.map(m=>m[1].amt)) || 1;

  area.innerHTML = `
    <div class="stat-summary">
      <div class="summary-box"><div class="s-lbl">총 매출액</div><div class="s-val">${(totalAmt/10000).toFixed(0)}만원</div></div>
      <div class="summary-box green"><div class="s-lbl">총 판매량</div><div class="s-val">${totalQty}m</div></div>
    </div>

    <div class="stats-section">
      <h4>🏆 제품별 판매 순위</h4>
      ${topProducts.map(([name,d],i)=>`
        <div class="stat-card">
          <div class="stat-row">
            <span style="font-size:13px;font-weight:700;color:var(--gray-500);min-width:20px">${i+1}</span>
            <span class="stat-name">${name}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.round(d.amt/maxAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="stats-section">
      <h4>🏢 거래처별 매출</h4>
      <div class="stat-card">
        ${topClients.map(([name,d])=>`
          <div class="stat-client-row">
            <span style="font-weight:600">${name}</span>
            <span style="color:var(--gray-500);font-size:12px">${d.cnt}건 · ${d.qty}m</span>
            <span style="font-weight:700;color:var(--blue)">${d.amt.toLocaleString()}원</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="stats-section">
      <h4>📅 월별 매출</h4>
      ${months.map(([month,d])=>`
        <div class="stat-card">
          <div class="stat-row">
            <span class="stat-name">${month}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar orange" style="width:${Math.round(d.amt/maxMonthAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <button class="reset-stats-btn" onclick="resetStats()">🗑 데이터 전체 삭제</button>
  `;

  document.getElementById('stats-ovl').classList.add('show');
  document.getElementById('stats-ovl').scrollTop = 0;
}

function closeStats(){ document.getElementById('stats-ovl').classList.remove('show'); }

function resetStats(){
  if(!confirm('모든 판매 데이터를 삭제할까요?')) return;
  localStorage.removeItem('om_sales');
  closeStats();
}

function exportStats(){
  const sales = loadSales();
  if(sales.length === 0){ alert('데이터가 없어요.'); return; }
  const header = '날짜,월,거래처,제품명,그룹,수량(m),금액,롤(m),절단(m)';
  const rows = sales.map(x=>`${x.date},${x.month},${x.client},${x.product},${x.group},${x.qty},${x.amt},${x.rollM},${x.cutM}`);
  const csv = '\uFEFF' + [header, ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `오션메이드_판매데이터_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

addItem();
</script>
</body>
</html>
