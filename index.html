<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오션메이드 필름 견적서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #1A4F8A;
  --blue-light: #EAF1FA;
  --blue-mid: #2E6BB5;
  --orange: #C05010;
  --orange-light: #FDF0E8;
  --green: #1A7A4A;
  --green-light: #E8F7EF;
  --gray-900: #1A1A1A;
  --gray-700: #3D3D3D;
  --gray-500: #6B6B6B;
  --gray-100: #F4F4F2;
  --gray-50: #FAFAF8;
  --white: #FFFFFF;
  --border: #E2DED9;
  --radius: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans KR', sans-serif; background: #E8E4DE; color: var(--gray-900); min-height: 100vh; }

header {
  background: linear-gradient(135deg, #1A4F8A 0%, #2563a8 100%);
  color: white; padding: 0 20px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 12px rgba(26,79,138,0.3);
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }

.container { max-width: 540px; margin: 0 auto; padding: 16px 14px 100px; }

.card {
  background: var(--white); border-radius: var(--radius);
  margin-bottom: 14px; overflow: hidden;
  border: 1px solid rgba(0,0,0,0.06); box-shadow: var(--shadow-sm);
}
.card-header {
  background: linear-gradient(to right, #F8F6F3, #FAFAF8);
  border-bottom: 1px solid var(--border); padding: 12px 18px;
  display: flex; align-items: center; gap: 10px;
}
.card-header .icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--blue), var(--blue-mid));
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; box-shadow: 0 2px 6px rgba(26,79,138,0.25);
}
.card-header h2 { font-size: 13px; font-weight: 700; color: var(--gray-700); letter-spacing: -0.2px; }
.card-body { padding: 16px 18px; }

/* FORM */
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label {
  font-size: 10px; color: var(--gray-500); font-weight: 700;
  display: block; margin-bottom: 6px; letter-spacing: 0.4px; text-transform: uppercase;
}
.field input, .field select {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 14px; font-family: inherit;
  background: var(--white); color: var(--gray-900);
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus, .field select:focus {
  outline: none; border-color: var(--blue-mid);
  box-shadow: 0 0 0 3px rgba(46,107,181,0.12);
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ITEM CARD */
.item-card {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
  box-shadow: var(--shadow-sm);
}

/* 접힌 상태 — 한 줄 요약 */
.item-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; cursor: pointer;
  background: white; transition: background 0.1s;
}
.item-row:active { background: var(--gray-50); }
.item-num {
  width: 22px; height: 22px; flex-shrink: 0;
  background: var(--blue); color: white;
  border-radius: 50%; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.item-row-info { flex: 1; min-width: 0; }
.item-row-name {
  font-size: 13px; font-weight: 700; color: var(--gray-900);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-row-sub { font-size: 11px; color: var(--gray-500); margin-top: 1px; }
.item-row-amt {
  font-size: 14px; font-weight: 800; color: var(--blue);
  white-space: nowrap; flex-shrink: 0;
}
.item-row-amt.zero { color: var(--gray-300); }
.item-expand-btn {
  width: 26px; height: 26px; flex-shrink: 0;
  background: var(--gray-50); border: 1px solid var(--border);
  border-radius: 6px; font-size: 11px; color: var(--gray-500);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.del-btn {
  width: 28px; height: 28px; flex-shrink: 0;
  background: none; border: 1px solid #EEDDDD;
  border-radius: 6px; font-size: 15px; color: #CC6666;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.del-btn:active { background: #FEE; }

/* 펼쳐진 상태 */
.item-detail {
  border-top: 1px solid var(--border);
  background: #FAFAF8;
}
.item-detail.hidden { display: none; }
.item-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* ★ 셀렉트 박스 새 디자인 */
.sel-group { display: flex; flex-direction: column; gap: 8px; }
.sel-block { position: relative; }
.sel-block label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
  text-transform: uppercase; display: block; margin-bottom: 5px;
}
.sel-block.cat label { color: var(--blue); }
.sel-block.model label { color: #1A6A3A; }
.sel-block::after {
  content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 11px; pointer-events: none; margin-top: 8px;
}
.sel-block.cat::after { color: var(--blue); }
.sel-block.model::after { color: #1A6A3A; }
.sel-block select {
  width: 100%; padding: 11px 36px 11px 14px;
  border-radius: 10px; font-size: 14px; font-family: inherit;
  -webkit-appearance: none; appearance: none; cursor: pointer;
  transition: all 0.15s; font-weight: 600;
}
.sel-block.cat select {
  border: 1.5px solid #A8C4E8; background: linear-gradient(to bottom, #EAF1FA, #DDE8F5);
  color: var(--blue);
}
.sel-block.cat select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,79,138,0.15); }
.sel-block.model select {
  border: 1.5px solid #A8CEB8; background: linear-gradient(to bottom, #EEF6F0, #E2F0E6);
  color: #1A5A2A;
}
.sel-block.model select:focus { outline: none; border-color: #1A6A3A; box-shadow: 0 0 0 3px rgba(26,106,58,0.12); }

/* PRICE */
.price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.price-box { border-radius: 12px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; }
.price-box.roll { background: linear-gradient(135deg, #EAF1FA, #DAE8F5); border: 1.5px solid #B0CCE8; }
.price-box.cut  { background: linear-gradient(135deg, #FDF0E8, #F8E4D4); border: 1.5px solid #E8BEA0; }
.price-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
.price-box.roll .price-tag { color: var(--blue); }
.price-box.cut  .price-tag { color: var(--orange); }
.price-val { font-size: 22px; font-weight: 800; line-height: 1.1; }
.price-box.roll .price-val { color: var(--blue); }
.price-box.cut  .price-val { color: var(--orange); }
.price-unit-txt { font-size: 11px; font-weight: 500; opacity: 0.7; }
.price-locked { display: flex; align-items: center; gap: 3px; font-size: 10px; color: rgba(0,0,0,0.28); margin-top: 2px; }
.price-locked::before { content: '🔒'; font-size: 9px; }

/* QTY */
.qty-box { background: var(--gray-50); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.qty-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.qty-label { font-size: 12px; font-weight: 700; color: var(--gray-700); }
.qty-stepper { display: flex; align-items: center; margin-left: auto; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--border); }
.qty-btn {
  width: 40px; height: 40px; border: none; background: white;
  font-size: 20px; color: var(--blue); font-weight: 700;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.qty-btn:active { background: var(--blue-light); }
.qty-input {
  width: 58px; height: 40px; border: none;
  border-left: 1.5px solid var(--border); border-right: 1.5px solid var(--border);
  text-align: center; font-size: 16px; font-weight: 700;
  font-family: inherit; color: var(--gray-900); background: white;
}
.qty-input:focus { outline: none; background: var(--blue-light); }
.qty-unit { font-size: 13px; color: var(--gray-500); margin-left: 6px; font-weight: 500; }
.qty-shorts { display: flex; gap: 6px; flex-wrap: wrap; }
.qty-short {
  padding: 6px 11px; font-size: 12px; font-family: inherit; font-weight: 600;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: white; color: var(--gray-700); cursor: pointer;
}
.qty-short:active { background: var(--blue); color: white; border-color: var(--blue); }

/* BREAKDOWN */
.breakdown { background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.bd-title { font-size: 10px; font-weight: 700; color: var(--gray-500); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
.bd-chips { display: flex; flex-direction: column; gap: 7px; }
.bd-chip { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 9px; font-size: 13px; }
.bd-chip.roll-chip { background: linear-gradient(to right, #EAF1FA, #DFF0FF); }
.bd-chip.cut-chip  { background: linear-gradient(to right, #FDF0E8, #FFF3E8); }
.bd-chip .chip-left { display: flex; align-items: center; gap: 7px; }
.bd-chip .chip-tag { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 5px; }
.roll-chip .chip-tag { background: var(--blue); color: white; }
.cut-chip  .chip-tag { background: var(--orange); color: white; }
.bd-chip .chip-desc { font-size: 12px; color: var(--gray-700); }
.bd-chip .chip-amt { font-size: 14px; font-weight: 700; }
.roll-chip .chip-amt { color: var(--blue); }
.cut-chip  .chip-amt { color: var(--orange); }
.bd-total { margin-top: 10px; padding-top: 10px; border-top: 1.5px dashed var(--border); display: flex; justify-content: space-between; align-items: baseline; }
.bd-total .lbl { font-size: 12px; color: var(--gray-500); font-weight: 600; }
.bd-total .val { font-size: 22px; font-weight: 800; color: var(--gray-900); }

/* ADD BTN */
.add-btn {
  width: 100%; padding: 15px;
  border: 2px dashed #C0CEDE; border-radius: var(--radius);
  background: rgba(234,241,250,0.5); font-size: 14px; font-family: inherit;
  color: var(--blue); cursor: pointer; font-weight: 600;
}
.add-btn:active { border-color: var(--blue); background: var(--blue-light); }

/* TOTAL BAR */
.total-bar {
  background: linear-gradient(135deg, #1A4F8A, #2563a8);
  border-radius: var(--radius); padding: 18px 22px;
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; color: white;
  box-shadow: 0 4px 16px rgba(26,79,138,0.35);
}
.total-bar .lbl { font-size: 14px; opacity: 0.85; font-weight: 500; }
.total-bar .amt { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }

/* BUTTONS */
.actions { display: flex; gap: 10px; }
.btn-reset {
  padding: 14px 22px; border: 1.5px solid var(--border); border-radius: var(--radius);
  background: white; font-size: 14px; font-family: inherit; color: var(--gray-700); cursor: pointer; font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.btn-preview {
  flex: 1; padding: 15px;
  background: linear-gradient(135deg, #1A4F8A, #2563a8); color: white; border: none;
  border-radius: var(--radius); font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  box-shadow: 0 4px 14px rgba(26,79,138,0.35);
}
.btn-preview:active { background: #163F6E; }

/* ===== PASSWORD SCREEN ===== */
.pw-screen {
  position: fixed; inset: 0; z-index: 999;
  background: var(--blue);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.pw-screen.hidden { display: none; }
.pw-box {
  background: white; border-radius: 16px;
  padding: 32px 28px; width: 100%; max-width: 340px;
  text-align: center;
}
.pw-logo { font-size: 40px; margin-bottom: 12px; }
.pw-title { font-size: 18px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
.pw-sub { font-size: 13px; color: var(--gray-500); margin-bottom: 24px; }
.pw-input {
  width: 100%; padding: 14px 16px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 20px; font-family: inherit; letter-spacing: 6px;
  text-align: center; color: var(--gray-900);
  margin-bottom: 12px;
}
.pw-input:focus { outline: none; border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(46,107,181,0.12); }
.pw-btn {
  width: 100%; padding: 14px;
  background: var(--blue); color: white; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 600;
  font-family: inherit; cursor: pointer;
}
.pw-btn:active { background: #163F6E; }
.pw-error { font-size: 13px; color: #C03030; margin-top: 10px; display: none; }
.pw-error.show { display: block; }

/* ===== MODAL / PREVIEW ===== */
.ovl {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 200;
  overflow-y: auto;
}
.ovl.show { display: block; }
.modal {
  background: white; margin: 0;
  min-height: 100vh;
}
.modal-bar {
  position: sticky; top: 0; z-index: 10;
  background: white; border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-bar h3 { font-size: 15px; font-weight: 600; }
.modal-actions { display: flex; gap: 8px; }
.btn-confirm {
  padding: 8px 16px;
  background: #1A7A4A; color: white; border: none;
  border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.btn-print {
  padding: 8px 16px;
  background: var(--blue); color: white; border: none;
  border-radius: 7px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
}
.close-btn {
  width: 36px; height: 36px;
  background: none; border: 1px solid var(--border);
  border-radius: 7px; font-size: 22px; color: var(--gray-500);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}

/* ===== PRINT / PREVIEW AREA ===== */
.parea { padding: 12px 12px; }

/* 모바일 견적서 카드형 */
.p-header {
  text-align: center; font-size: 18px; font-weight: 700;
  letter-spacing: 6px; margin-bottom: 10px; color: #111;
}
.p-info-box {
  border: 1.5px solid #333; border-radius: 0;
  margin-bottom: 8px; overflow: hidden;
}
.p-info-row {
  display: flex; border-bottom: 1px solid #ddd;
  font-size: 12px;
}
.p-info-row:last-child { border-bottom: none; }
.p-info-key {
  width: 70px; min-width: 70px; padding: 6px 8px;
  background: #f5f5f5; color: #555; font-size: 11px;
  border-right: 1px solid #ddd; font-weight: 500;
}
.p-info-val { padding: 6px 8px; color: #222; flex: 1; word-break: break-all; }

.p-supplier {
  border: 1.5px solid #333; border-radius: 0;
  margin-bottom: 8px; overflow: hidden;
}
.p-supplier-title {
  background: #f0f0f0; text-align: center;
  padding: 5px; font-size: 12px; font-weight: 700;
  border-bottom: 1px solid #ddd;
}

.p-note { font-size: 10px; color: #666; margin-bottom: 8px; line-height: 1.5; }

/* 품목 테이블 */
.p-table { width:100%; border-collapse:collapse; margin-bottom:8px; font-size:13px; }
.p-table thead tr { background:#1A4F8A; color:white; }
.p-table th { padding:7px 8px; text-align:left; font-size:11px; font-weight:600; }
.p-table th:last-child, .p-table td:last-child { text-align:right; }
.p-table th:nth-child(2), .p-table td:nth-child(2) { text-align:center; }
.p-table th:nth-child(3), .p-table td:nth-child(3) { text-align:right; }
.p-table td { padding:6px 8px; border-bottom:1px solid #eee; color:#222; }
.p-table tbody tr:nth-child(even) { background:#fafafa; }
.p-table tfoot td { padding:8px 8px; background:#f0f0f0; border-top:2px solid #1A4F8A; font-size:13px; }

.p-total {
  background: #1A4F8A; color: white;
  border-radius: 7px; padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center;
  margin: 8px 0 8px;
}
.p-total .tl { font-size: 13px; opacity: 0.85; }
.p-total .tv { font-size: 20px; font-weight: 700; }

.p-bank {
  border: 2px solid #1A4F8A;
  border-radius: 8px; margin-bottom: 8px;
  overflow: hidden;
}
.p-bank-notice {
  background: #D05010; color: white;
  text-align: center; padding: 7px;
  font-size: 14px; font-weight: 700; letter-spacing: 2px;
}
.p-bank-label {
  font-size: 10px; color: #666; font-weight: 500;
  padding: 7px 12px 1px;
}
.p-bank-num {
  font-size: 20px; font-weight: 700; color: #1A4F8A;
  padding: 0 12px 4px; letter-spacing: 1px;
}
.p-bank-info {
  font-size: 12px; color: #444;
  padding: 0 12px 8px;
}
.p-footnote { display: none; }

/* STATS */
.stats-section { margin-bottom: 20px; }
.stats-section h4 { font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.stat-card { background: var(--gray-50); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.stat-name { font-size: 13px; font-weight: 600; color: var(--gray-900); flex: 1; }
.stat-qty { font-size: 12px; color: var(--gray-500); min-width: 50px; text-align: right; }
.stat-amt { font-size: 14px; font-weight: 700; color: var(--blue); min-width: 90px; text-align: right; }
.stat-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; }
.stat-bar { height: 6px; background: var(--blue); border-radius: 3px; transition: width 0.3s; }
.stat-bar.orange { background: var(--orange); }
.stats-empty { text-align: center; padding: 40px; color: var(--gray-500); font-size: 14px; }
.stat-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.summary-box { background: var(--blue); color: white; border-radius: 10px; padding: 14px; text-align: center; }
.summary-box.green { background: #1A7A4A; }
.summary-box .s-lbl { font-size: 11px; opacity: 0.8; margin-bottom: 4px; }
.summary-box .s-val { font-size: 20px; font-weight: 700; }
.stat-client-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.stat-client-row:last-child { border-bottom: none; }
.reset-stats-btn { width: 100%; padding: 10px; border: 1px solid #F99; border-radius: 8px; background: none; color: #C33; font-size: 13px; font-family: inherit; cursor: pointer; margin-top: 8px; }

@media print {
  header, .modal-bar { display: none !important; }
  .ovl { position: static !important; background: none !important; }
  .modal { min-height: unset; }
  .parea { padding: 10px; }
}
</style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div class="pw-screen" id="pw-screen">
  <div class="pw-box">
    <div class="pw-logo">🎬</div>
    <div class="pw-title">오션메이드 견적서</div>
    <div class="pw-sub">비밀번호를 입력하세요</div>
    <input class="pw-input" id="pw-input" type="password" maxlength="20"
      onkeydown="if(event.key==='Enter') checkPw()">
    <button class="pw-btn" onclick="checkPw()">확인</button>
    <div class="pw-error" id="pw-error">비밀번호가 틀렸습니다</div>
  </div>
</div>

<header>
  <h1>🎬 오션메이드 필름 견적서</h1>
  <button onclick="showStats()" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:white;padding:6px 12px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer">📊 판매현황</button>
</header>

<div class="container">
  <!-- 거래처 -->
  <div class="card">
    <div class="card-header">
      <div class="icon">📋</div>
      <h2>거래처 정보</h2>
    </div>
    <div class="card-body">
      <div class="row2">
        <div class="field"><label>거래처명</label><input id="client" type="text"></div>

function today(){ return new Date().toISOString().slice(0,10); }
document.getElementById('rdate').value = today();
document.getElementById('sdate').value = today();

function calc(qty, r, c){
  if(qty<=0) return {amt:0,rollM:0,cutM:0};
  const rollM = Math.floor(qty/ROLL_M)*ROLL_M;
  const cutM  = qty % ROLL_M;
  return { amt: rollM*r + cutM*c, rollM, cutM };
}

function addItem(){
  const id=cnt++;
  const firstKey=MODEL_KEYS[0];
  const db=MODEL_DB[firstKey];
  const p=PRODUCTS[db.pidx];
  items.push({id, catKey:firstKey, modelName:db.models[0], qty:5, r:p.roll, c:p.cut});
  renderAll();
}
function removeItem(id){ items=items.filter(x=>x.id!==id); renderAll(); }
function get(id){ return items.find(x=>x.id===id); }

function onCat(id, catKey){
  const it=get(id); it.catKey=catKey;
  const db=MODEL_DB[catKey]; const p=PRODUCTS[db.pidx];
  it.modelName=db.models[0]; it.r=p.roll; it.c=p.cut;
  renderAll();
}
function onModel(id, modelName){ get(id).modelName=modelName; renderAll(); }
function onQty(id,v){ get(id).qty=+v||0; renderAll(); }
function stepQty(id,d){ const it=get(id); it.qty=Math.max(0,it.qty+d); renderAll(); }
function setQty(id,v){ get(id).qty=v; renderAll(); }

function renderAll(){
  const wrap=document.getElementById('items-wrap');
  wrap.innerHTML=''; let total=0;
  items.forEach((it,idx)=>{ const{amt}=calc(it.qty,it.r,it.c); total+=amt; wrap.appendChild(buildEl(it,idx+1)); });
  document.getElementById('total-display').textContent=total.toLocaleString()+' 원';
}

function toggleItem(id){
  const el = document.querySelector(`.item-detail[data-id="${id}"]`);
  const btn = document.querySelector(`.item-expand-btn[data-id="${id}"]`);
  if(!el) return;
  const hidden = el.classList.toggle('hidden');
  btn.textContent = hidden ? '✎' : '▲';
}

function buildEl(it,num){
  const db=MODEL_DB[it.catKey];
  const {amt,rollM,cutM}=calc(it.qty,it.r,it.c);
  const div=document.createElement('div'); div.className='item-card';

  // 접힌 상태 요약
  const qtyStr = it.qty > 0 ? `${it.qty}m` : '수량미입력';
  const typeStr = rollM>0&&cutM>0 ? `롤${rollM}m+절단${cutM}m` : rollM>0 ? `롤 ${rollM}m` : `절단 ${it.qty}m`;
  const amtStr = amt > 0 ? amt.toLocaleString()+'원' : '0원';

  let chips='';
  if(it.qty>0){
    if(rollM>0&&cutM>0){
      chips=`<div class="bd-chip roll-chip"><div class="chip-left"><span class="chip-tag">롤</span><span class="chip-desc">${rollM}m × ${it.r.toLocaleString()}원</span></div><span class="chip-amt">${(rollM*it.r).toLocaleString()}원</span></div>
             <div class="bd-chip cut-chip"><div class="chip-left"><span class="chip-tag">절단</span><span class="chip-desc">${cutM}m × ${it.c.toLocaleString()}원</span></div><span class="chip-amt">${(cutM*it.c).toLocaleString()}원</span></div>`;
    } else if(rollM>0){
      chips=`<div class="bd-chip roll-chip"><div class="chip-left"><span class="chip-tag">롤</span><span class="chip-desc">${rollM}m × ${it.r.toLocaleString()}원</span></div><span class="chip-amt">${amt.toLocaleString()}원</span></div>`;
    } else {
      chips=`<div class="bd-chip cut-chip"><div class="chip-left"><span class="chip-tag">절단</span><span class="chip-desc">${cutM}m × ${it.c.toLocaleString()}원</span></div><span class="chip-amt">${amt.toLocaleString()}원</span></div>`;
    }
  }
  const catOpts=MODEL_KEYS.map(k=>`<option value="${k}"${k===it.catKey?' selected':''}>${k}</option>`).join('');
  const modelOpts=db.models.map(m=>`<option value="${m}"${m===it.modelName?' selected':''}>${m}</option>`).join('');

  // 새로 추가된 항목은 펼쳐서 보여줌 (qty=5이면 아직 설정 중)
  const isNew = it.qty === 5 && it.modelName === db.models[0];
  const detailHidden = isNew ? '' : 'hidden';
  const expandIcon = isNew ? '▲' : '✎';

  div.innerHTML=`
    <div class="item-row" onclick="toggleItem(${it.id})">
      <div class="item-num">${num}</div>
      <div class="item-row-info">
        <div class="item-row-name">${it.modelName}</div>
        <div class="item-row-sub">${it.qty > 0 ? typeStr : '수량을 입력하세요'}</div>
      </div>
      <div class="item-row-amt ${amt===0?'zero':''}">${amtStr}</div>
      <button class="item-expand-btn" data-id="${it.id}" onclick="event.stopPropagation();toggleItem(${it.id})">${expandIcon}</button>
      <button class="del-btn" onclick="event.stopPropagation();removeItem(${it.id})">×</button>
    </div>
    <div class="item-detail ${detailHidden}" data-id="${it.id}">
      <div class="item-body">
        <div class="sel-group">
          <div class="sel-block cat">
            <label>① 대분류</label>
            <select onchange="onCat(${it.id},this.value)">${catOpts}</select>
          </div>
          <div class="sel-block model">
            <label>② 품명</label>
            <select onchange="onModel(${it.id},this.value)">${modelOpts}</select>
          </div>
        </div>
        <div class="price-row">
          <div class="price-box roll">
            <div class="price-tag">롤 단가 (25m↑)</div>
            <div class="price-val">${it.r.toLocaleString()}<span class="price-unit-txt">원/m</span></div>
            <span class="price-locked">고정단가</span>
          </div>
          <div class="price-box cut">
            <div class="price-tag">절단 단가 (25m↓)</div>
            <div class="price-val">${it.c.toLocaleString()}<span class="price-unit-txt">원/m</span></div>
            <span class="price-locked">고정단가</span>
          </div>
        </div>
        <div class="qty-box">
          <div class="qty-top">
            <span class="qty-label">수 량</span>
            <div class="qty-stepper">
              <button class="qty-btn" onclick="stepQty(${it.id},-5)">−</button>
              <input class="qty-input" type="number" value="${it.qty}" oninput="onQty(${it.id},this.value)">
              <button class="qty-btn" onclick="stepQty(${it.id},5)">＋</button>
            </div>
            <span class="qty-unit">m</span>
          </div>
          <div class="qty-shorts">
            ${[5,10,15,20,25,30,40,50,75,100].map(q=>`<button class="qty-short" onclick="setQty(${it.id},${q})">${q}m</button>`).join('')}
          </div>
        </div>
        <div class="breakdown">
          <div class="bd-title">계산 내역</div>
          <div class="bd-chips">${chips}</div>
          <div class="bd-total"><span class="lbl">소계</span><span class="val">${amt.toLocaleString()} 원</span></div>
        </div>
      </div>
    </div>`;
  return div;
}

// ===== 판매 데이터 =====
function loadSales(){ try{ return JSON.parse(localStorage.getItem('om_sales')||'[]'); }catch(e){ return []; } }
function saveSales(data){ localStorage.setItem('om_sales', JSON.stringify(data)); }

function confirmQuote(){
  const client = document.getElementById('client').value || '(거래처명)';
  const rd = document.getElementById('rdate').value;
  if(items.length === 0){ alert('품목을 추가해주세요.'); return; }

  const sales = loadSales();
  const month = rd.slice(0, 7); // YYYY-MM
  items.forEach(it => {
    const p = PRODUCTS[MODEL_DB[it.catKey].pidx];
    const {amt, rollM, cutM} = calc(it.qty, it.r, it.c);
    sales.push({
      date: rd, month, client,
      product: it.modelName,
      group: it.catKey,
      qty: it.qty, amt, rollM, cutM
    });
  });
  saveSales(sales);

  // 확정 표시
  const btn = document.querySelector('.btn-confirm');
  btn.textContent = '✅ 저장완료!';
  btn.style.background = '#888';
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = '✅ 견적 확정';
    btn.style.background = '#1A7A4A';
    btn.disabled = false;
  }, 2000);
}

function showStats(){
  const sales = loadSales();
  const area = document.getElementById('stats-area');

  if(sales.length === 0){
    area.innerHTML = '<div class="stats-empty">📭 아직 확정된 견적이 없어요<br><br>견적서 보기 → 견적 확정 버튼을 누르면<br>데이터가 쌓여요!</div>';
    document.getElementById('stats-ovl').classList.add('show');
    return;
  }

  // 집계
  const totalAmt = sales.reduce((s,x)=>s+x.amt,0);
  const totalQty = sales.reduce((s,x)=>s+x.qty,0);

  // 제품별
  const byProduct = {};
  sales.forEach(x=>{
    if(!byProduct[x.product]) byProduct[x.product]={qty:0,amt:0};
    byProduct[x.product].qty += x.qty;
    byProduct[x.product].amt += x.amt;
  });
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].amt-a[1].amt).slice(0,10);
  const maxAmt = topProducts[0]?.[1]?.amt || 1;

  // 거래처별
  const byClient = {};
  sales.forEach(x=>{
    if(!byClient[x.client]) byClient[x.client]={qty:0,amt:0,cnt:0};
    byClient[x.client].qty += x.qty;
    byClient[x.client].amt += x.amt;
    byClient[x.client].cnt++;
  });
  const topClients = Object.entries(byClient).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8);

  // 월별
  const byMonth = {};
  sales.forEach(x=>{
    if(!byMonth[x.month]) byMonth[x.month]={amt:0,qty:0};
    byMonth[x.month].amt += x.amt;
    byMonth[x.month].qty += x.qty;
  });
  const months = Object.entries(byMonth).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const maxMonthAmt = Math.max(...months.map(m=>m[1].amt)) || 1;

  area.innerHTML = `
    <div class="stat-summary">
      <div class="summary-box"><div class="s-lbl">총 매출액</div><div class="s-val">${(totalAmt/10000).toFixed(0)}만원</div></div>
      <div class="summary-box green"><div class="s-lbl">총 판매량</div><div class="s-val">${totalQty}m</div></div>
    </div>

    <div class="stats-section">
      <h4>🏆 제품별 판매 순위</h4>
      ${topProducts.map(([name,d],i)=>`
        <div class="stat-card">
          <div class="stat-row">
            <span style="font-size:13px;font-weight:700;color:var(--gray-500);min-width:20px">${i+1}</span>
            <span class="stat-name">${name}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.round(d.amt/maxAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="stats-section">
      <h4>🏢 거래처별 매출</h4>
      <div class="stat-card">
        ${topClients.map(([name,d])=>`
          <div class="stat-client-row">
            <span style="font-weight:600">${name}</span>
            <span style="color:var(--gray-500);font-size:12px">${d.cnt}건 · ${d.qty}m</span>
            <span style="font-weight:700;color:var(--blue)">${d.amt.toLocaleString()}원</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="stats-section">
      <h4>📅 월별 매출</h4>
      ${months.map(([month,d])=>`
        <div class="stat-card">
          <div class="stat-row">
            <span class="stat-name">${month}</span>
            <span class="stat-qty">${d.qty}m</span>
            <span class="stat-amt">${d.amt.toLocaleString()}원</span>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar orange" style="width:${Math.round(d.amt/maxMonthAmt*100)}%"></div></div>
        </div>
      `).join('')}
    </div>

    <button class="reset-stats-btn" onclick="resetStats()">🗑 데이터 전체 삭제</button>
  `;

  document.getElementById('stats-ovl').classList.add('show');
  document.getElementById('stats-ovl').scrollTop = 0;
}

function closeStats(){ document.getElementById('stats-ovl').classList.remove('show'); }

function resetStats(){
  if(!confirm('모든 판매 데이터를 삭제할까요?')) return;
  localStorage.removeItem('om_sales');
  closeStats();
}

function exportStats(){
  const sales = loadSales();
  if(sales.length === 0){ alert('데이터가 없어요.'); return; }
  const header = '날짜,월,거래처,제품명,그룹,수량(m),금액,롤(m),절단(m)';
  const rows = sales.map(x=>`${x.date},${x.month},${x.client},${x.product},${x.group},${x.qty},${x.amt},${x.rollM},${x.cutM}`);
  const csv = '\uFEFF' + [header, ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `오션메이드_판매데이터_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
